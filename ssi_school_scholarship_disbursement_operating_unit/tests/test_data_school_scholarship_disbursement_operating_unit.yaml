scenarios:
  - name: "Operating Unit - Derivation, Move Propagation, and Cancel"
    steps:
      # ── Shared fixture chain (prefix P) ─────────────────────────────
      - step: "Create Operating Unit A's own partner"
        action: "create"
        model: "res.partner"
        save_as: "p_ou_a_partner"
        values:
          name: "P Disb OU A Partner"

      - step: "Create Operating Unit A"
        action: "create"
        model: "operating.unit"
        save_as: "p_ou_a"
        values:
          name: "P Disb Operating Unit A"
          code: "PDBOUA"
          company_id: "REC: company.id"
          partner_id: "REC: p_ou_a_partner.id"

      - step: "Create the grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "p_grade_type"
        values:
          name: "P Disb Grade Type"
          code: "PDBGT"

      - step: "Create the school, belonging to Operating Unit A"
        action: "create"
        model: "school"
        save_as: "p_school"
        values:
          name: "P Disb School"
          code: "PDBSC"
          grade_type_id: "REC: p_grade_type.id"
          operating_unit_ids: [[6, 0, ["REC: p_ou_a.id"]]]

      - step: "Create the academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "p_academic_year"
        values:
          name: "P Disb Academic Year"
          code: "PDBAY"
          date_start: 2026-07-01
          date_end: 2027-06-30

      - step: "Create the academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "p_academic_term"
        values:
          name: "P Disb Term"
          code: "PDBTM"
          date_start: 2026-07-01
          date_end: 2026-12-31
          year_id: "REC: p_academic_year.id"

      - step: "Create the grade"
        action: "create"
        model: "school_grade"
        save_as: "p_grade"
        values:
          name: "P Disb Grade"
          code: "PDBGR"
          type_id: "REC: p_grade_type.id"

      - step: "Create the grade class"
        action: "create"
        model: "school_grade_class"
        save_as: "p_grade_class"
        values:
          name: "P Disb Class"
          code: "PDBCL"
          school_id: "REC: p_school.id"
          grade_id: "REC: p_grade.id"

      - step: "Create the student contact"
        action: "create"
        model: "res.partner"
        save_as: "p_contact"
        values:
          name: "P Disb Contact"

      - step: "Create the student"
        action: "create"
        model: "school_student"
        save_as: "p_student"
        values:
          name: "P Disb Student"
          code: "PDBST"
          contact_id: "REC: p_contact.id"
          school_id: "REC: p_school.id"

      - step: "Create the enrollment"
        action: "create"
        model: "school_enrollment"
        save_as: "p_enrollment"
        values:
          academic_year_id: "REC: p_academic_year.id"
          academic_term_id: "REC: p_academic_term.id"
          school_id: "REC: p_school.id"
          grade_id: "REC: p_grade.id"
          grade_class_id: "REC: p_grade_class.id"
          student_id: "REC: p_student.id"

      - step: "Create the funding source's analytic account"
        action: "create"
        model: "account.analytic.account"
        save_as: "p_analytic"
        values:
          name: "P Disb Analytic"

      - step: "Create the funding source"
        action: "create"
        model: "school_scholarship_funding_source"
        save_as: "p_funding_source"
        values:
          name: "P Disb Funding Source"
          code: "PDBFS"
          analytic_account_id: "REC: p_analytic.id"

      - step: "Create the product covered by the benefit line"
        action: "create"
        model: "product.product"
        save_as: "p_product"
        values:
          name: "P Disb Product"
          type: "service"

      - step: "Create the cash journal used for disbursement"
        action: "create"
        model: "account.journal"
        save_as: "p_journal"
        values:
          name: "P Disb Cash Journal"
          code: "PDBJ"
          type: "cash"

      - step:
          "Create a dummy sale journal (school_scholarship_type requires a Deduction
          Journal even though this module never posts a deduction)"
        action: "create"
        model: "account.journal"
        save_as: "p_dummy_journal"
        values:
          name: "P Disb Dummy Deduction Journal"
          code: "PDBJD"
          type: "sale"

      - step: "Get the account.account.type Income reference"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "p_account_type_income"

      - step: "Get the account.account.type Expenses reference"
        action: "ref"
        xml_id: "account.data_account_type_expenses"
        save_as: "p_account_type_expense"

      - step: "Get the account.account.type Payable reference"
        action: "ref"
        xml_id: "account.data_account_type_payable"
        save_as: "p_account_type_payable"

      - step: "Create the payable account credited by the disbursement"
        action: "create"
        model: "account.account"
        save_as: "p_payable_account"
        values:
          name: "P Disb Payable Account"
          code: "PDBPA"
          user_type_id: "REC: p_account_type_payable.id"
          reconcile: true

      - step: "Create the expense account the disbursement line posts to"
        action: "create"
        model: "account.account"
        save_as: "p_expense_account"
        values:
          name: "P Disb Expense Account"
          code: "PDBEA"
          user_type_id: "REC: p_account_type_expense.id"
          reconcile: false

      - step:
          "Create a dummy discount account (school_scholarship_type requires one even
          though this module never posts a deduction)"
        action: "create"
        model: "account.account"
        save_as: "p_discount_account"
        values:
          name: "P Disb Discount Account"
          code: "PDBDA"
          user_type_id: "REC: p_account_type_income.id"
          reconcile: false

      - step: "Create the scholarship type"
        action: "create"
        model: "school_scholarship_type"
        save_as: "p_type"
        values:
          name: "P Disb Type"
          code: "PDBTY"
          deduction_journal_id: "REC: p_dummy_journal.id"
          discount_account_id: "REC: p_discount_account.id"
          disbursement_journal_id: "REC: p_journal.id"
          payable_account_id: "REC: p_payable_account.id"

      - step: "Create the scholarship program"
        action: "create"
        model: "school_scholarship_program"
        save_as: "p_program"
        values:
          name: "P Disb Program"
          code: "PDBPRG"
          type_id: "REC: p_type.id"
          school_id: "REC: p_school.id"
          academic_year_id: "REC: p_academic_year.id"
          funding_source_ids: [[6, 0, ["REC: p_funding_source.id"]]]
          deduction_journal_id: "REC: p_dummy_journal.id"
          discount_account_id: "REC: p_discount_account.id"
          disbursement_journal_id: "REC: p_journal.id"
          payable_account_id: "REC: p_payable_account.id"
          scope_ids:
            - - 0
              - 0
              - scope_basis: "product"
                product_id: "REC: p_product.id"
                benefit_type: "cash"
                computation: "fixed"
                percentage: 0.0
                amount_fixed: 100000.0

      # ── Positive #1: create a disbursement from an Award belonging
      # to a specific Operating Unit -- operating_unit_id gets filled ──
      - step: "Create the award backing the disbursement, on Operating Unit A"
        action: "create"
        model: "school_scholarship_award"
        save_as: "p_award"
        values:
          name: "P-DISB-OU-AWARD-001"
          program_id: "REC: p_program.id"
          student_id: "REC: p_student.id"
          enrollment_id: "REC: p_enrollment.id"
          date_start: 2026-07-01
          date_end: 2026-12-31
          expense_account_id: "REC: p_expense_account.id"
          benefit_ids:
            - - 0
              - 0
              - name: "P Disb Benefit"
                product_id: "REC: p_product.id"
                benefit_type: "cash"
                computation: "fixed"
                amount_fixed: 500000.0
                periodicity: "one_time"
          funding_ids:
            - - 0
              - 0
              - funding_source_id: "REC: p_funding_source.id"
                percentage: 100.0

      - step:
          "The award itself already carries Operating Unit A
          (ssi_school_scholarship_operating_unit)"
        action: "assert"
        target: "p_award"
        asserts:
          operating_unit_id:
            type: "m2o"
            expected: "REC: p_ou_a"

      - step: "Find the award's Benefit line"
        action: "search"
        model: "school_scholarship_award_benefit"
        domain: [["award_id", "=", "REC: p_award.id"]]
        limit: 1
        save_as: "p_benefit"

      - step: "Find the award's Funding line"
        action: "search"
        model: "school_scholarship_award_funding"
        domain: [["award_id", "=", "REC: p_award.id"]]
        limit: 1
        save_as: "p_funding"

      - step: "Create the Schedule line realizing the Benefit"
        action: "create"
        model: "school_scholarship_award_schedule"
        save_as: "p_schedule"
        values:
          benefit_id: "REC: p_benefit.id"
          date: 2026-08-01
          state: "scheduled"

      - step: "Create the disbursement document, without setting Operating Unit explicitly"
        action: "create"
        model: "school_scholarship_disbursement"
        save_as: "p_disbursement"
        values:
          award_id: "REC: p_award.id"
          date: 2026-08-05
          date_due: 2026-08-10
          journal_id: "REC: p_journal.id"
          payable_account_id: "REC: p_payable_account.id"
          payment_method: "cash"
          user_id: "REF: base.user_admin"
          line_ids:
            - - 0
              - 0
              - schedule_id: "REC: p_schedule.id"
                funding_id: "REC: p_funding.id"
                final_account_id: "REC: p_expense_account.id"
                name: "P Disb Disbursement Line"
                uom_quantity: 1
                price_unit: 500000.0

      - step: "Operating Unit is derived from the Award at create time"
        action: "assert"
        target: "p_disbursement"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          operating_unit_id:
            type: "m2o"
            expected: "REC: p_ou_a"

      # ── Positive #2: onchange (action: form) -- setting award_id on a
      # new document fills operating_unit_id too ───────────────────────
      - step: "Open a new Disbursement form and select the Award"
        action: "form"
        model: "school_scholarship_disbursement"
        save: false
        ops:
          - set:
              award_id: "REC: p_award"
          - assert:
              operating_unit_id:
                type: "m2o"
                expected: "REC: p_ou_a"

      # ── Positive #3: transition state, then the generated move
      # carries the same Operating Unit as the document ────────────────
      - step: "Confirm the disbursement as admin"
        action: "call"
        target: "p_disbursement"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Assert between confirm and approve (busts the cached policy field)"
        action: "assert"
        target: "p_disbursement"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve the disbursement, opening it and posting its journal entry"
        action: "call"
        target: "p_disbursement"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "open"
          move_id:
            type: "value"
            operator: "is_truthy"

      - step: "The generated move carries the same Operating Unit as the disbursement"
        action: "assert"
        target: "p_disbursement"
        asserts:
          move_id.operating_unit_id:
            type: "m2o"
            expected: "REC: p_ou_a"

      - step: "Find the disbursement's own generated move"
        action: "search"
        model: "account.move"
        domain: [["id", "=", "REC: p_disbursement.move_id.id"]]
        limit: 1
        save_as: "p_move"

      # ── Positive #4: every journal item of the generated move carries
      # the same Operating Unit -- checked via an o2m assert on
      # move_id.line_ids (total count), corroborated by a search
      # filtered on that same Operating Unit returning the identical
      # count ────────────────────────────────────────────────────────
      - step: "The move carries exactly two journal items (header credit + Line debit)"
        action: "assert"
        target: "p_disbursement"
        asserts:
          move_id.line_ids:
            type: "o2m"
            check: "count"
            expected_count: 2

      - step: "Every journal item of the move carries Operating Unit A"
        action: "search"
        model: "account.move.line"
        domain:
          [
            ["move_id", "=", "REC: p_move.id"],
            ["operating_unit_id", "=", "REC: p_ou_a.id"],
          ]
        save_as: "p_ou_lines"
        expect_count: 2

      # ── Positive #5: cancelling deletes the move but the document
      # keeps its own Operating Unit ────────────────────────────────
      - step: "Create the cancellation reason"
        action: "create"
        model: "base.cancel_reason"
        save_as: "p_reason"
        values:
          name: "P Disb Cancel Reason"
          code: "PDBCR"

      - step: "Cancel the disbursement via the wizard"
        action: "wizard"
        model: "base.select_cancel_reason"
        target: "p_disbursement"
        as_user: "base.user_admin"
        values:
          cancel_reason_id: "REC: p_reason.id"
        method: "action_confirm"
        asserts:
          state:
            type: "value"
            expected: "cancel"

      - step: "Cancelling deleted the accounting entry, but the OU is kept"
        action: "assert"
        target: "p_disbursement"
        refresh: true
        asserts:
          move_id:
            type: "value"
            operator: "is_falsy"
          operating_unit_id:
            type: "m2o"
            expected: "REC: p_ou_a"

  - name: "Operating Unit - Negative: Cross-Operating-Unit Read Rejected"
    steps:
      # ── Shared fixture chain (prefix N) ──────────────────────────────
      - step: "Create Operating Unit A's own partner (the school's own OU)"
        action: "create"
        model: "res.partner"
        save_as: "n_ou_main_partner"
        values:
          name: "N Disb OU Main Partner"

      - step: "Create the main Operating Unit"
        action: "create"
        model: "operating.unit"
        save_as: "n_ou_main"
        values:
          name: "N Disb Operating Unit Main"
          code: "NDBOUM"
          company_id: "REC: company.id"
          partner_id: "REC: n_ou_main_partner.id"

      - step: "Create Operating Unit Restricted's own partner"
        action: "create"
        model: "res.partner"
        save_as: "n_ou_restricted_partner"
        values:
          name: "N Disb OU Restricted Partner"

      - step: "Create the restricted Operating Unit (the restricted user's own)"
        action: "create"
        model: "operating.unit"
        save_as: "n_ou_restricted"
        values:
          name: "N Disb Operating Unit Restricted"
          code: "NDBOUR"
          company_id: "REC: company.id"
          partner_id: "REC: n_ou_restricted_partner.id"

      - step: "Create the grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "n_grade_type"
        values:
          name: "N Disb Grade Type"
          code: "NDBGT"

      - step: "Create the school, belonging to the main Operating Unit"
        action: "create"
        model: "school"
        save_as: "n_school"
        values:
          name: "N Disb School"
          code: "NDBSC"
          grade_type_id: "REC: n_grade_type.id"
          operating_unit_ids: [[6, 0, ["REC: n_ou_main.id"]]]

      - step: "Create the academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "n_academic_year"
        values:
          name: "N Disb Academic Year"
          code: "NDBAY"
          date_start: 2026-07-01
          date_end: 2027-06-30

      - step: "Create the academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "n_academic_term"
        values:
          name: "N Disb Term"
          code: "NDBTM"
          date_start: 2026-07-01
          date_end: 2026-12-31
          year_id: "REC: n_academic_year.id"

      - step: "Create the grade"
        action: "create"
        model: "school_grade"
        save_as: "n_grade"
        values:
          name: "N Disb Grade"
          code: "NDBGR"
          type_id: "REC: n_grade_type.id"

      - step: "Create the grade class"
        action: "create"
        model: "school_grade_class"
        save_as: "n_grade_class"
        values:
          name: "N Disb Class"
          code: "NDBCL"
          school_id: "REC: n_school.id"
          grade_id: "REC: n_grade.id"

      - step: "Create the student contact"
        action: "create"
        model: "res.partner"
        save_as: "n_contact"
        values:
          name: "N Disb Contact"

      - step: "Create the student"
        action: "create"
        model: "school_student"
        save_as: "n_student"
        values:
          name: "N Disb Student"
          code: "NDBST"
          contact_id: "REC: n_contact.id"
          school_id: "REC: n_school.id"

      - step: "Create the enrollment"
        action: "create"
        model: "school_enrollment"
        save_as: "n_enrollment"
        values:
          academic_year_id: "REC: n_academic_year.id"
          academic_term_id: "REC: n_academic_term.id"
          school_id: "REC: n_school.id"
          grade_id: "REC: n_grade.id"
          grade_class_id: "REC: n_grade_class.id"
          student_id: "REC: n_student.id"

      - step: "Create the funding source's analytic account"
        action: "create"
        model: "account.analytic.account"
        save_as: "n_analytic"
        values:
          name: "N Disb Analytic"

      - step: "Create the funding source"
        action: "create"
        model: "school_scholarship_funding_source"
        save_as: "n_funding_source"
        values:
          name: "N Disb Funding Source"
          code: "NDBFS"
          analytic_account_id: "REC: n_analytic.id"

      - step: "Create the product covered by the program's Scope line"
        action: "create"
        model: "product.product"
        save_as: "n_product"
        values:
          name: "N Disb Product"
          type: "service"

      - step: "Create the cash journal used for disbursement"
        action: "create"
        model: "account.journal"
        save_as: "n_journal"
        values:
          name: "N Disb Cash Journal"
          code: "NDBJ"
          type: "cash"

      - step: "Create a dummy sale journal for the type's required field"
        action: "create"
        model: "account.journal"
        save_as: "n_dummy_journal"
        values:
          name: "N Disb Dummy Deduction Journal"
          code: "NDBJD"
          type: "sale"

      - step: "Get the account.account.type Income reference"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "n_account_type_income"

      - step: "Get the account.account.type Payable reference"
        action: "ref"
        xml_id: "account.data_account_type_payable"
        save_as: "n_account_type_payable"

      - step: "Create the payable account credited by the disbursement"
        action: "create"
        model: "account.account"
        save_as: "n_payable_account"
        values:
          name: "N Disb Payable Account"
          code: "NDBPA"
          user_type_id: "REC: n_account_type_payable.id"
          reconcile: true

      - step: "Create a dummy discount account for the type's required field"
        action: "create"
        model: "account.account"
        save_as: "n_discount_account"
        values:
          name: "N Disb Discount Account"
          code: "NDBDA"
          user_type_id: "REC: n_account_type_income.id"
          reconcile: false

      - step: "Create the scholarship type"
        action: "create"
        model: "school_scholarship_type"
        save_as: "n_type"
        values:
          name: "N Disb Type"
          code: "NDBTY"
          deduction_journal_id: "REC: n_dummy_journal.id"
          discount_account_id: "REC: n_discount_account.id"
          disbursement_journal_id: "REC: n_journal.id"
          payable_account_id: "REC: n_payable_account.id"

      - step: "Create the scholarship program"
        action: "create"
        model: "school_scholarship_program"
        save_as: "n_program"
        values:
          name: "N Disb Program"
          code: "NDBPRG"
          type_id: "REC: n_type.id"
          school_id: "REC: n_school.id"
          academic_year_id: "REC: n_academic_year.id"
          funding_source_ids: [[6, 0, ["REC: n_funding_source.id"]]]
          deduction_journal_id: "REC: n_dummy_journal.id"
          discount_account_id: "REC: n_discount_account.id"
          disbursement_journal_id: "REC: n_journal.id"
          payable_account_id: "REC: n_payable_account.id"
          scope_ids:
            - - 0
              - 0
              - scope_basis: "product"
                product_id: "REC: n_product.id"
                benefit_type: "cash"
                computation: "fixed"
                percentage: 0.0
                amount_fixed: 100000.0

      # ``user_id`` is set explicitly to admin (not the restricted user
      # created below) so the rejection asserted further down is
      # unambiguously caused by the Operating Unit record rule, not by
      # the built-in ownership record rule
      # (``school_scholarship_disbursement_internal_user_rule``, which
      # OR's its own ``user_id = user.id`` domain into the same access
      # check).
      - step: "Create the award, owned by admin, in the main operating unit"
        action: "create"
        model: "school_scholarship_award"
        save_as: "n_award"
        values:
          name: "N-DISB-OU-AWARD-001"
          program_id: "REC: n_program.id"
          student_id: "REC: n_student.id"
          enrollment_id: "REC: n_enrollment.id"
          date_start: 2026-07-01
          date_end: 2026-12-31
          user_id: "REF: base.user_admin"

      - step: "Assert the award's operating unit is the main one"
        action: "assert"
        target: "n_award"
        asserts:
          operating_unit_id:
            type: "m2o"
            expected: "REC: n_ou_main"

      - step: "Create the disbursement, owned by admin, in the main operating unit"
        action: "create"
        model: "school_scholarship_disbursement"
        save_as: "n_disbursement"
        values:
          award_id: "REC: n_award.id"
          date: 2026-08-05
          date_due: 2026-08-10
          journal_id: "REC: n_journal.id"
          payable_account_id: "REC: n_payable_account.id"
          payment_method: "cash"
          user_id: "REF: base.user_admin"

      - step: "Sanity: the disbursement carries the main Operating Unit"
        action: "assert"
        target: "n_disbursement"
        asserts:
          operating_unit_id:
