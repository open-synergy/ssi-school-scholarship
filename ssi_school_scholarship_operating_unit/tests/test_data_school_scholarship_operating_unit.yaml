      - step: "Get the account.account.type Income reference"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "account_type_income7"

      - step: "Create the discount account"
        action: "create"
        model: "account.account"
        save_as: "discount_account7"
        values:
          name: "AWOU7 Discount Account"
          code: "AWOU7DA"
          user_type_id: "REC: account_type_income7.id"
          reconcile: false

      - step: "Create the scholarship type"
        action: "create"
        model: "school_scholarship_type"
        save_as: "type7"
        values:
          name: "AWOU7 Type"
          code: "AWOU7TY"
          deduction_journal_id: "REC: journal7.id"
          discount_account_id: "REC: discount_account7.id"

      - step: "Create the scholarship program"
        action: "create"
        model: "school_scholarship_program"
        save_as: "program7"
        values:
          name: "AWOU7 Program"
          code: "AWOU7PRG"
          type_id: "REC: type7.id"
          school_id: "REC: school7.id"
          academic_year_id: "REC: academic_year7.id"
          funding_source_ids: [[6, 0, ["REC: funding_source7.id"]]]
          deduction_journal_id: "REC: journal7.id"
          discount_account_id: "REC: discount_account7.id"
          scope_ids:
            - - 0
              - 0
              - scope_basis: "product"
                product_id: "REC: product7.id"
                benefit_type: "fee_reduction"
                computation: "percentage"
                percentage: 40.0

      # ``user_id`` is set explicitly to admin (not the restricted
      # user created below) so the rejection asserted further down is
      # unambiguously caused by the Operating Unit record rule, not by
      # the built-in ownership record rule
      # (``school_scholarship_award_internal_user_rule``, which OR's
      # its own ``user_id = user.id`` domain into the same access
      # check).
      - step: "Create the award, owned by admin, in the main operating unit"
        action: "create"
        model: "school_scholarship_award"
        save_as: "award7"
        values:
          program_id: "REC: program7.id"
          student_id: "REC: student7.id"
          enrollment_id: "REC: enrollment7.id"
          date_start: 2026-07-01
          date_end: 2026-12-31
          user_id: "REF: base.user_admin"

      - step: "Assert the award's operating unit is the main one"
        action: "assert"
        target: "award7"
        asserts:
          operating_unit_id:
            type: "m2o"
            expected: "REC: ou7_main"

      - step: "Create a user restricted to the OTHER operating unit"
        action: "create"
        model: "res.users"
        save_as: "restricted_user7"
        values:
          name: "AWOU7 Restricted User"
          login: "awou7_restricted_user@example.com"
          groups_id:
            - - 6
              - 0
              - - "REF: base.group_user"
                - "REF: ssi_school_scholarship.school_scholarship_award_user_group"
                - "REF:
                  ssi_school_scholarship_operating_unit.school_scholarship_award_operating_unit_group"
          assigned_operating_unit_ids:
            - - 6
              - 0
              - - "REC: ou7_restricted.id"

      - step: "Restricted user cannot read the award"
        action: "call"
        target: "award7"
        method: "read"
        args:
          - - "date"
        as_user: "restricted_user7"
        expect_error:
          type: "AccessError"

      - step: "Restricted user cannot write the award"
        action: "write"
        target: "award7"
        as_user: "restricted_user7"
        expect_error:
          type: "AccessError"
        values:
          date: 2026-08-10
