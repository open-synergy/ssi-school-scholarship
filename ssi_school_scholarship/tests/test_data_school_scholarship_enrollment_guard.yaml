options:
  auto_refresh: true
scenarios:
  - name: "Enrollment Guards - Payment Term Deletion And Enrollment Cancel"
    steps:
      # ── Shared fixture chain (suffix EG1) ────────────────────────
      - step: "Create the grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "eg1_grade_type"
        values:
          name: "EG1 Grade Type"
          code: "EG1GT"

      - step: "Create the school"
        action: "create"
        model: "school"
        save_as: "eg1_school"
        values:
          name: "EG1 School"
          code: "EG1SC"
          grade_type_id: "REC: eg1_grade_type.id"

      - step: "Create the academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "eg1_academic_year"
        values:
          name: "EG1 Academic Year"
          code: "EG1AY"
          date_start: 2026-07-01
          date_end: 2027-06-30

      - step: "Create the academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "eg1_academic_term"
        values:
          name: "EG1 Term"
          code: "EG1TM"
          date_start: 2026-07-01
          date_end: 2026-12-31
          year_id: "REC: eg1_academic_year.id"

      - step: "Create the grade"
        action: "create"
        model: "school_grade"
        save_as: "eg1_grade"
        values:
          name: "EG1 Grade"
          code: "EG1GR"
          type_id: "REC: eg1_grade_type.id"

      - step: "Create the grade class"
        action: "create"
        model: "school_grade_class"
        save_as: "eg1_grade_class"
        values:
          name: "EG1 Class"
          code: "EG1CL"
          school_id: "REC: eg1_school.id"
          grade_id: "REC: eg1_grade.id"

      - step: "Create the student contact"
        action: "create"
        model: "res.partner"
        save_as: "eg1_contact"
        values:
          name: "EG1 Contact"

      - step: "Create the student"
        action: "create"
        model: "school_student"
        save_as: "eg1_student"
        values:
          name: "EG1 Student"
          code: "EG1ST"
          contact_id: "REC: eg1_contact.id"
          school_id: "REC: eg1_school.id"

      - step: "Create the enrollment"
        action: "create"
        model: "school_enrollment"
        save_as: "eg1_enrollment"
        values:
          academic_year_id: "REC: eg1_academic_year.id"
          academic_term_id: "REC: eg1_academic_term.id"
          school_id: "REC: eg1_school.id"
          grade_id: "REC: eg1_grade.id"
          grade_class_id: "REC: eg1_grade_class.id"
          student_id: "REC: eg1_student.id"

      - step: "Create the analytic account for the funding source"
        action: "create"
        model: "account.analytic.account"
        save_as: "eg1_analytic"
        values:
          name: "EG1 Analytic"

      - step: "Create the funding source"
        action: "create"
        model: "school_scholarship_funding_source"
        save_as: "eg1_funding_source"
        values:
          name: "EG1 Funding Source"
          code: "EG1FS"
          analytic_account_id: "REC: eg1_analytic.id"

      - step: "Create the product covered by the benefit line"
        action: "create"
        model: "product.product"
        save_as: "eg1_product"
        values:
          name: "EG1 Product"
          type: "service"

      - step: "Create the sale journal used by the scholarship type"
        action: "create"
        model: "account.journal"
        save_as: "eg1_journal"
        values:
          name: "EG1 Journal"
          code: "JEG1"
          type: "sale"

      - step: "Get the account.account.type Income reference"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "account_type_income"

      - step: "Create the discount account"
        action: "create"
        model: "account.account"
        save_as: "eg1_discount_account"
        values:
          name: "EG1 Discount Account"
          code: "EG1DA"
          user_type_id: "REC: account_type_income.id"
          reconcile: false

      - step: "Create the income account used by payment term details"
        action: "create"
        model: "account.account"
        save_as: "eg1_income_account"
        values:
          name: "EG1 Income Account"
          code: "EG1IA"
          user_type_id: "REC: account_type_income.id"
          reconcile: false

      - step: "Create the scholarship type"
        action: "create"
        model: "school_scholarship_type"
        save_as: "eg1_type"
        values:
          name: "EG1 Type"
          code: "EG1TY"
          deduction_journal_id: "REC: eg1_journal.id"
          discount_account_id: "REC: eg1_discount_account.id"

      - step: "Create the scholarship program"
        action: "create"
        model: "school_scholarship_program"
        save_as: "eg1_program"
        values:
          name: "EG1 Program"
          code: "EG1PRG"
          type_id: "REC: eg1_type.id"
          school_id: "REC: eg1_school.id"
          academic_year_id: "REC: eg1_academic_year.id"
          funding_source_ids: [[6, 0, ["REC: eg1_funding_source.id"]]]
          deduction_journal_id: "REC: eg1_journal.id"
          discount_account_id: "REC: eg1_discount_account.id"
          scope_ids:
            - - 0
              - 0
              - scope_basis: "product"
                product_id: "REC: eg1_product.id"
                benefit_type: "fee_reduction"
                computation: "percentage"
                percentage: 40.0

      # ── Six Payment Terms, one per month, each with one detail line
      # matching EG1 Product at 1,000,000 -- the enrollment's billing

      - step: "Get the sale journal for the payment template"
        action: "search"
        model: "account.journal"
        domain: [["type", "=", "sale"]]
        save_as: "eg1_sale_journal"
        limit: 1

      - step: "Get the receivable account type"
        action: "ref"
        xml_id: "account.data_account_type_receivable"
        save_as: "eg1_receivable_type"

      - step: "Create the receivable account"
        action: "create"
        model: "account.account"
        save_as: "eg1_receivable_account"
        values:
          name: "EG1 Receivable Account"
          code: "EG1RA"
          user_type_id: "REC: eg1_receivable_type.id"
          reconcile: true

      - step: "Create the customer invoice type"
        action: "create"
        model: "customer_invoice_type"
        save_as: "eg1_ci_type"
        values:
          name: "EG1 Customer Invoice Type"
          code: "EG1CIT"
          journal_id: "REC: eg1_sale_journal.id"
          receivable_account_id: "REC: eg1_receivable_account.id"

      - step: "Create an empty payment template"
        action: "create"
        model: "school_enrollment_payment_template"
        save_as: "eg1_template"
        values:
          name: "EG1 Payment Template"
          code: "EG1PT"
          school_id: "REC: eg1_school.id"
          grade_id: "REC: eg1_grade.id"
          academic_term_id: "REC: eg1_academic_term.id"
          journal_id: "REC: eg1_sale_journal.id"
          receivable_account_id: "REC: eg1_receivable_account.id"
          customer_invoice_type_id: "REC: eg1_ci_type.id"

      - step: "Attach the payment template to the enrollment"
        action: "write"
        target: "eg1_enrollment"
        values:
          payment_template_id: "REC: eg1_template.id"

      - step: "Create the cancellation reason"
        action: "create"
        model: "base.cancel_reason"
        save_as: "eg1_cancel_reason"
        values:
          name: "EG1 Cancel Reason"
          code: "EG1CR"

      - step: "Create Payment Term 1 (July)"
        action: "create"
        model: "school_enrollment_payment_term"
        save_as: "eg1_term1"
        values:
          enrollment_id: "REC: eg1_enrollment.id"
          name: "EG1 Term July"
          date_invoice: 2026-07-01
          detail_ids:
            - - 0
              - 0
              - product_id: "REC: eg1_product.id"
                name: "EG1 Term July Fee"
                account_id: "REC: eg1_income_account.id"
                uom_quantity: 1.0
                uom_id: "REF: uom.product_uom_unit"
                price_unit: 1000000.0

      - step: "Enrollment is still in Draft"
        action: "assert"
        target: "eg1_enrollment"
        asserts:
          state:
            type: "value"
            expected: "draft"

      - step: "Create the award on the Draft enrollment"
        action: "create"
        model: "school_scholarship_award"
        save_as: "eg1_award"
        values:
          program_id: "REC: eg1_program.id"
          student_id: "REC: eg1_student.id"
          enrollment_id: "REC: eg1_enrollment.id"
          date_start: 2026-07-01
          date_end: 2026-12-31
          discount_account_id: "REC: eg1_discount_account.id"
          user_id: "REF: base.user_admin"
          benefit_ids:
            - - 0
              - 0
              - name: "EG1 Benefit"
                product_id: "REC: eg1_product.id"
                price_unit: 1000000.0
                percentage: 40.0
          funding_ids:
            - - 0
              - 0
              - funding_source_id: "REC: eg1_funding_source.id"
                percentage: 100.0

      - step: "Confirm the award as admin"
        action: "call"
        target: "eg1_award"
        method: "action_confirm"
        as_user: "REF: base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve the award as admin (opens it, generating the Schedule)"
        action: "call"
        target: "eg1_award"
        method: "action_approve_approval"
        as_user: "REF: base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "The award has a Schedule line on the enrollment term"
        action: "assert"
        target: "eg1_award"
        asserts:
          schedule_ids:
            type: "o2m"
            check: "count"
            expected_count: 1

      # -- Negative: deleting a term referred to by a Schedule line
      - step: "Compute Payment is rejected while a Schedule line refers to the term"
        action: "call"
        target: "eg1_enrollment"
        method: "action_compute_payment"
        as_user: "base.user_admin"
        expect_error:
          type: "UserError"
          message_contains: "is referenced by scholarship award"

      - step: "Deleting a term pinned by a Schedule line is rejected"
        action: "unlink"
        target: "eg1_term1"
        expect_error:
          type: "UserError"
          message_contains: "is referenced by scholarship award"

      # -- Negative: cancelling the enrollment with an active award
      - step: "Cancel the enrollment while the award is Open is rejected"
        action: "wizard"
        model: "base.select_cancel_reason"
        target: "eg1_enrollment"
        as_user: "base.user_admin"
        values:
          cancel_reason_id: "REC: eg1_cancel_reason.id"
        method: "action_confirm"
        expect_error:
          type: "UserError"
          message_contains: "has an active scholarship award"

      - step: "Cancel the award"
        action: "wizard"
        model: "base.select_cancel_reason"
        target: "eg1_award"
        as_user: "base.user_admin"
        values:
          cancel_reason_id: "REC: eg1_cancel_reason.id"
        method: "action_confirm"
        asserts:
          state:
            type: "value"
            expected: "cancel"

      - step: "Cancel the enrollment once no award is active"
        action: "wizard"
        model: "base.select_cancel_reason"
        target: "eg1_enrollment"
        as_user: "base.user_admin"
        values:
          cancel_reason_id: "REC: eg1_cancel_reason.id"
        method: "action_confirm"
        asserts:
          state:
            type: "value"
            expected: "cancel"
