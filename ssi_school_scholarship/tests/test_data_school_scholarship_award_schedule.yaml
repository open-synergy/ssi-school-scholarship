          message_contains: "require a Payment Term"
        values:
          benefit_id: "REC: as4_benefit.id"
          date: 2026-08-01

      # ── Negative: a schedule line whose Payment Term belongs to a
      # different Enrollment than the award's own.
      - step: "Reject a schedule line whose Payment Term is another Enrollment's"
        action: "create"
        model: "school_scholarship_award_schedule"
        expect_error:
          type: "ValidationError"
          message_contains: "does not belong"
        values:
          benefit_id: "REC: as4_benefit.id"
          payment_term_id: "REC: as4_term_b.id"
          date: 2026-08-01

      # ── Negative: two schedule lines pairing the same Benefit and
      # Payment Term.
      - step: "Create the first schedule line against Term A"
        action: "create"
        model: "school_scholarship_award_schedule"
        save_as: "as4_schedule"
        values:
          benefit_id: "REC: as4_benefit.id"
          payment_term_id: "REC: as4_term_a.id"
          date: 2026-08-01

      - step: "Reject a second schedule line pairing the same Benefit and Term"
        action: "create"
        model: "school_scholarship_award_schedule"
        expect_error:
          type: "ValidationError"
          message_contains: "already scheduled"
        values:
          benefit_id: "REC: as4_benefit.id"
          payment_term_id: "REC: as4_term_a.id"
          date: 2026-08-01

      # ── Negative: a Cash Benefit's schedule line must not carry a
      # Payment Term.
      - step: "Create a Cash Benefit line on the same award"
        action: "create"
        model: "school_scholarship_award_benefit"
        save_as: "as4_benefit_cash"
        values:
          award_id: "REC: as4_award.id"
          name: "AS4 Cash Benefit"
          product_id: "REC: as4_product.id"
          benefit_type: "cash"

      - step: "Reject a Cash schedule line that carries a Payment Term"
        action: "create"
        model: "school_scholarship_award_schedule"
        expect_error:
          type: "ValidationError"
          message_contains: "must not carry a Payment Term"
        values:
          benefit_id: "REC: as4_benefit_cash.id"
          payment_term_id: "REC: as4_term_a.id"
          date: 2026-08-01

      # ── Negative: generating the schedule of a Draft award is
      # rejected by the ``generate_schedule_ok`` policy.
      - step: "Reject generating the Schedule of a Draft award"
        action: "call"
        target: "as4_award"
        method: "action_generate_schedule"
        expect_error:
          type: "UserError"
          message_contains: "not allowed to generate schedule"

      # ── Negative: cancelling an award with a Realized schedule
      # line is rejected. The line is written straight to Realized
      # as a fixture, since the deduction module that would normally
      # realize it is out of this item's scope.
      - step: "Write the schedule line straight to Realized (fixture only)"
        action: "write"
        target: "as4_schedule"
        values:
          state: "realized"

      - step: "Assert the schedule line is now Realized"
        action: "assert"
        target: "as4_schedule"
        asserts:
          state:
            type: "value"
            expected: "realized"

      - step: "Assert Amount Realized now sums the Realized line"
        action: "assert"
        target: "as4_award"
        asserts:
          amount_realized:
            type: "value"
            expected: 400000.0

      - step: "Reject cancelling an award with a Realized schedule line"
        action: "call"
        target: "as4_award"
        method: "action_cancel"
        expect_error:
          type: "UserError"
          message_contains: "realized Schedule line"
