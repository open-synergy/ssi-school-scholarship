        save_as: "as3_program"
        values:
          name: "AS3 Program"
          code: "AS3PRG"
          type_id: "REC: as3_type.id"
          school_id: "REC: as3_school.id"
          academic_year_id: "REC: as3_academic_year.id"
          deduction_journal_id: "REC: as3_journal.id"
          discount_account_id: "REC: as3_discount_account.id"
          scope_ids:
            - - 0
              - 0
              - scope_basis: "product"
                product_id: "REC: as3_product.id"
                benefit_type: "cash"
                computation: "fixed"
                amount_fixed: 50000.0

      # ── A draft award with two Cash Benefit lines: One Time (a
      # single period) and Monthly (a two-month range below yields
      # two periods) -- neither carries a Payment Term, so this
      # never touches ``_generate_fee_reduction_schedule``.
      - step: "Create a draft award with two Cash Benefit lines"
        action: "create"
        model: "school_scholarship_award"
        save_as: "as3_award"
        values:
          program_id: "REC: as3_program.id"
          student_id: "REC: as3_student.id"
          enrollment_id: "REC: as3_enrollment.id"
          date_start: 2026-07-01
          date_end: 2026-08-31
          benefit_ids:
            - - 0
              - 0
              - name: "AS3 Benefit One Time"
                product_id: "REC: as3_product.id"
                benefit_type: "cash"
                computation: "fixed"
                amount_fixed: 100000.0
                periodicity: "one_time"
            - - 0
              - 0
              - name: "AS3 Benefit Monthly"
                product_id: "REC: as3_product.id"
                benefit_type: "cash"
                computation: "fixed"
                amount_fixed: 50000.0
                periodicity: "monthly"

      - step: "Find the Monthly Cash Benefit line"
        action: "search"
        model: "school_scholarship_award_benefit"
        domain:
          [["award_id", "=", "REC: as3_award.id"], ["name", "=", "AS3 Benefit Monthly"]]
        limit: 1
        save_as: "as3_benefit_monthly"

      - step: "Find the One Time Cash Benefit line"
        action: "search"
        model: "school_scholarship_award_benefit"
        domain:
          [
            ["award_id", "=", "REC: as3_award.id"],
            ["name", "=", "AS3 Benefit One Time"],
          ]
        limit: 1
        save_as: "as3_benefit_one_time"

      # Generation is normally gated to state Open, but this award is
      # never confirmed/approved here -- ``bypass_policy_check``
      # exercises the generator in isolation, the same escape hatch
      # ``school_enrollment``'s own ``_create_due_invoice`` uses for
      # its policy check.
      - step: "Generate the Schedule directly (bypassing the Open-state policy)"
        action: "call"
        target: "as3_award"
        method: "_generate_schedule"
        context:
          bypass_policy_check: true

      - step: "Assert the One Time line got exactly one Schedule line"
        action: "search"
        model: "school_scholarship_award_schedule"
        domain: [["benefit_id", "=", "REC: as3_benefit_one_time.id"]]
        save_as: "as3_one_time_schedules"
        expect_count: 1

      - step: "Assert the Monthly line got one Schedule line per month"
        action: "search"
        model: "school_scholarship_award_schedule"
        domain: [["benefit_id", "=", "REC: as3_benefit_monthly.id"]]
        save_as: "as3_monthly_schedules"
        expect_count: 2

      - step: "Regenerate directly again (idempotent for Cash lines too)"
        action: "call"
        target: "as3_award"
        method: "_generate_schedule"
        context:
          bypass_policy_check: true

      - step: "Assert regeneration did not add a third Monthly line"
        action: "search"
        model: "school_scholarship_award_schedule"
        domain: [["benefit_id", "=", "REC: as3_benefit_monthly.id"]]
        save_as: "as3_monthly_schedules_after_regenerate"
        expect_count: 2

