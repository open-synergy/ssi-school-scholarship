        action: "assert"
        target: "as2_schedule_fixed"
        asserts:
          amount_planned:
            type: "value"
            expected: 350000.0

      # ── Positive (compute, Full Coverage computation).
      - step: "Create the Full schedule line against Term A"
        action: "create"
        model: "school_scholarship_award_schedule"
        save_as: "as2_schedule_full"
        values:
          benefit_id: "REC: as2_benefit_full.id"
          payment_term_id: "REC: as2_term_a.id"
          date: "REC: as2_term_a.date_invoice"

      - step: "Assert Amount Planned equals the full Base Amount"
        action: "assert"
        target: "as2_schedule_full"
        asserts:
          amount_planned:
            type: "value"
            expected: 1000000.0

      # ── Positive (compute, Max Amount per Period cap).
      - step: "Create the Capped schedule line against Term A"
        action: "create"
        model: "school_scholarship_award_schedule"
        save_as: "as2_schedule_capped"
        values:
          benefit_id: "REC: as2_benefit_capped.id"
          payment_term_id: "REC: as2_term_a.id"
          date: "REC: as2_term_a.date_invoice"

      - step: "Assert Amount Planned is capped at Max Amount per Period"
        action: "assert"
        target: "as2_schedule_capped"
        asserts:
          amount_planned:
            type: "value"
            expected: 300000.0

      # ── Positive (compute, empty condition): a Cash line with no
      # Payment Term.
      - step: "Create the Cash schedule line with no Payment Term"
        action: "create"
        model: "school_scholarship_award_schedule"
        save_as: "as2_schedule_cash"
        values:
          benefit_id: "REC: as2_benefit_cash.id"
          date: 2026-08-01

      - step: "Assert Base Amount is zero without a Payment Term"
        action: "assert"
        target: "as2_schedule_cash"
        asserts:
          base_amount:
            type: "value"
            expected: 0.0
          name:
            type: "value"
            expected: "2026-08-01"

      # ── Negative: Amount Planned cannot be negative.
      - step: "Reject writing a negative Amount Planned"
        action: "write"
        target: "as2_schedule_percentage"
        expect_error:
          type: "ValidationError"
          message_contains: "negative"
        values:
          amount_planned: -1.0

