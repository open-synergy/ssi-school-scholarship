scenarios:
  - name: "Scope - Create Percentage Product"
    steps:
      - step: "Get the account.account.type Income reference"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "account_type_income"

      - step: "Create the sale journal used by the scholarship type"
        action: "create"
        model: "account.journal"
        save_as: "sale_journal"
        values:
          name: "Test Scope Sale Journal 1"
          code: "TSCJ01"
          type: "sale"

      - step: "Create the discount account used by the scholarship type"
        action: "create"
        model: "account.account"
        save_as: "discount_account"
        values:
          name: "Test Scope Discount Account 1"
          code: "TSCA01"
          user_type_id: "REC: account_type_income.id"
          reconcile: false

      - step: "Create the scholarship type"
        action: "create"
        model: "school_scholarship_type"
        save_as: "type"
        values:
          name: "Test Scope Type 1"
          code: "TSCT01"
          deduction_journal_id: "REC: sale_journal.id"
          discount_account_id: "REC: discount_account.id"

      - step: "Create the grade type used by the school"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Test Scope Grade Type 1"
          code: "TSCGT01"

      - step: "Create the school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "Test Scope School 1"
          code: "TSCS01"
          grade_type_id: "REC: grade_type.id"

      - step: "Create the academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year"
        values:
          name: "Test Scope Academic Year 1"
          code: "TSCY01"
          date_start: 2026-07-01
          date_end: 2027-06-30

      - step: "Create the analytic account for the funding source"
        action: "create"
        model: "account.analytic.account"
        save_as: "analytic_account"
        values:
          name: "Test Scope Analytic 1"

      - step: "Create the funding source"
        action: "create"
        model: "school_scholarship_funding_source"
        save_as: "funding_source"
        values:
          name: "Test Scope Funding Source 1"
          code: "TSCF01"
          analytic_account_id: "REC: analytic_account.id"

      - step: "Create the product covered by the scope line"
        action: "create"
        model: "product.product"
        save_as: "product"
        values:
          name: "Test Scope Product 1"
          type: "service"

      - step: "Create the scholarship program with a percentage scope line"
        action: "create"
        model: "school_scholarship_program"
        save_as: "program"
        values:
          name: "Test Scope Program 1"
          code: "TSCP001"
          type_id: "REC: type.id"
          school_id: "REC: school.id"
          academic_year_id: "REC: academic_year.id"
          funding_source_ids: [[6, 0, ["REC: funding_source.id"]]]
          deduction_journal_id: "REC: sale_journal.id"
          discount_account_id: "REC: discount_account.id"
          scope_ids:
            - - 0
              - 0
              - scope_basis: "product"
                product_id: "REC: product.id"
                benefit_type: "fee_reduction"
                computation: "percentage"
                percentage: 40.0

      - step: "Assert the scope line was created"
        action: "assert"
        target: "program"
        asserts:
          scope_ids:
            type: "o2m"
            check: "count"
            expected_count: 1

