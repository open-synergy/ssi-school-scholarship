          deduction_journal_id: "REC: sale_journal.id"
          discount_account_id: "REC: discount_account.id"

      - step: "Create the grade type used by the school"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Test Scope Grade Type 3"
          code: "TSCGT03"

      - step: "Create the school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "Test Scope School 3"
          code: "TSCS03"
          grade_type_id: "REC: grade_type.id"

      - step: "Create the academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year"
        values:
          name: "Test Scope Academic Year 3"
          code: "TSCY03"
          date_start: 2026-07-01
          date_end: 2027-06-30

      - step: "Create the analytic account for the funding source"
        action: "create"
        model: "account.analytic.account"
        save_as: "analytic_account"
        values:
          name: "Test Scope Analytic 3"

      - step: "Create the funding source"
        action: "create"
        model: "school_scholarship_funding_source"
        save_as: "funding_source"
        values:
          name: "Test Scope Funding Source 3"
          code: "TSCF03"
          analytic_account_id: "REC: analytic_account.id"

      - step: "Create the first product covered by the scope line"
        action: "create"
        model: "product.product"
        save_as: "product_a"
        values:
          name: "Test Scope Product 3a"
          type: "service"

      - step: "Create the second product to replace the first with"
        action: "create"
        model: "product.product"
        save_as: "product_b"
        values:
          name: "Test Scope Product 3b"
          type: "service"

      - step: "Create the scholarship program with one scope line"
        action: "create"
        model: "school_scholarship_program"
        save_as: "program"
        values:
          name: "Test Scope Program 3"
          code: "TSCP003"
          type_id: "REC: type.id"
          school_id: "REC: school.id"
          academic_year_id: "REC: academic_year.id"
          funding_source_ids: [[6, 0, ["REC: funding_source.id"]]]
          deduction_journal_id: "REC: sale_journal.id"
          discount_account_id: "REC: discount_account.id"
          scope_ids:
            - - 0
              - 0
              - scope_basis: "product"
                product_id: "REC: product_a.id"
                benefit_type: "fee_reduction"
                computation: "percentage"
                percentage: 40.0

      - step: "Get the original scope line"
        action: "search"
        model: "school_scholarship_program_scope"
        domain: [["program_id", "=", "REC: program.id"]]
        save_as: "old_scope"
        limit: 1

      - step: "Unlink the original line and add another in one write"
        action: "write"
        target: "program"
        values:
          scope_ids:
            - - 2
              - "REC: old_scope.id"
              - 0
            - - 0
              - 0
              - scope_basis: "product"
                product_id: "REC: product_b.id"
                benefit_type: "cash"
                computation: "full"

      - step: "Assert the program still has exactly one scope line"
        action: "assert"
        target: "program"
        asserts:
          scope_ids:
            type: "o2m"
            check: "count"
            expected_count: 1

