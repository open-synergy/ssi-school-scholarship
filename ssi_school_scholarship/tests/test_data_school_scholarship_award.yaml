scenarios:
  - name: "Award - Create, Compute, Workflow, And Cancel"
    steps:
      # ── Shared fixture chain (suffix AW1) ────────────────────────
      - step: "Create the grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type1"
        values:
          name: "AW1 Grade Type"
          code: "AW1GT"

      - step: "Create the school"
        action: "create"
        model: "school"
        save_as: "school1"
        values:
          name: "AW1 School"
          code: "AW1SC"
          grade_type_id: "REC: grade_type1.id"

      - step: "Create the academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year1"
        values:
          name: "AW1 Academic Year"
          code: "AW1AY"
          date_start: 2026-07-01
          date_end: 2027-06-30

      - step: "Create the academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term1"
        values:
          name: "AW1 Term"
          code: "AW1TM"
          date_start: 2026-07-01
          date_end: 2026-12-31
          year_id: "REC: academic_year1.id"

      - step: "Create the grade"
        action: "create"
        model: "school_grade"
        save_as: "grade1"
        values:
          name: "AW1 Grade"
          code: "AW1GR"
          type_id: "REC: grade_type1.id"

      - step: "Create the grade class"
        action: "create"
        model: "school_grade_class"
        save_as: "grade_class1"
        values:
          name: "AW1 Class"
          code: "AW1CL"
          school_id: "REC: school1.id"
          grade_id: "REC: grade1.id"

      - step: "Create the student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact1"
        values:
          name: "AW1 Contact"

      - step: "Create the student"
        action: "create"
        model: "school_student"
        save_as: "student1"
        values:
          name: "AW1 Student"
          code: "AW1ST"
          contact_id: "REC: contact1.id"
          school_id: "REC: school1.id"

      - step: "Create the enrollment"
        action: "create"
        model: "school_enrollment"
        save_as: "enrollment1"
        values:
          academic_year_id: "REC: academic_year1.id"
          academic_term_id: "REC: academic_term1.id"
          school_id: "REC: school1.id"
          grade_id: "REC: grade1.id"
          grade_class_id: "REC: grade_class1.id"
          student_id: "REC: student1.id"

      - step: "Create the analytic account for the funding source"
        action: "create"
        model: "account.analytic.account"
        save_as: "analytic1"
        values:
          name: "AW1 Analytic"

      - step: "Create the funding source"
        action: "create"
        model: "school_scholarship_funding_source"
        save_as: "funding_source1"
        values:
          name: "AW1 Funding Source"
          code: "AW1FS"
          analytic_account_id: "REC: analytic1.id"

      - step: "Create the product covered by the benefit line"
        action: "create"
        model: "product.product"
        save_as: "product1"
        values:
          name: "AW1 Product"
          type: "service"

      - step: "Create the sale journal used by the scholarship type"
        action: "create"
        model: "account.journal"
        save_as: "journal1"
        values:
          name: "AW1 Journal"
          code: "JAW1"
          type: "sale"

      - step: "Get the account.account.type Income reference"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "account_type_income"

      - step: "Create the discount account"
        action: "create"
        model: "account.account"
        save_as: "discount_account1"
        values:
          name: "AW1 Discount Account"
          code: "AW1DA"
          user_type_id: "REC: account_type_income.id"
          reconcile: false

      - step: "Create the scholarship type"
        action: "create"
        model: "school_scholarship_type"
        save_as: "type1"
        values:
          name: "AW1 Type"
          code: "AW1TY"
          deduction_journal_id: "REC: journal1.id"
          discount_account_id: "REC: discount_account1.id"

      - step: "Create the scholarship program"
        action: "create"
        model: "school_scholarship_program"
        save_as: "program1"
        values:
          name: "AW1 Program"
          code: "AW1PRG"
          type_id: "REC: type1.id"
          school_id: "REC: school1.id"
          academic_year_id: "REC: academic_year1.id"
          funding_source_ids: [[6, 0, ["REC: funding_source1.id"]]]
          deduction_journal_id: "REC: journal1.id"
          discount_account_id: "REC: discount_account1.id"
          scope_ids:
            - - 0
              - 0
              - scope_basis: "product"
                product_id: "REC: product1.id"
                benefit_type: "fee_reduction"
                computation: "percentage"
                percentage: 40.0

      # ── Positive (compute, empty condition): no Benefit line ────
      - step: "Create an award with no Benefit line"
        action: "create"
        model: "school_scholarship_award"
        save_as: "award_zero"
        values:
          program_id: "REC: program1.id"
          student_id: "REC: student1.id"
          enrollment_id: "REC: enrollment1.id"
          date_start: 2026-07-01
          date_end: 2026-12-31
          discount_account_id: "REC: discount_account1.id"
          funding_ids:
            - - 0
              - 0
              - funding_source_id: "REC: funding_source1.id"
                percentage: 100.0

      - step: "Assert Amount Awarded is zero without any Benefit line"
        action: "assert"
        target: "award_zero"
        asserts:
          amount_awarded:
            type: "value"
            expected: 0.0

      # ── Positive (compute): two Benefit lines ───────────────────
      - step: "Create an award with two Benefit lines"
        action: "create"
        model: "school_scholarship_award"
        save_as: "award_two"
        values:
          program_id: "REC: program1.id"
          student_id: "REC: student1.id"
          enrollment_id: "REC: enrollment1.id"
          date_start: 2026-07-01
          date_end: 2026-12-31
          discount_account_id: "REC: discount_account1.id"
          benefit_ids:
            - - 0
              - 0
              - name: "AW1 Benefit Line 1"
                product_id: "REC: product1.id"
                price_unit: 300000.0
            - - 0
              - 0
              - name: "AW1 Benefit Line 2"
                product_id: "REC: product1.id"
                price_unit: 200000.0
          funding_ids:
            - - 0
              - 0
              - funding_source_id: "REC: funding_source1.id"
                percentage: 100.0

      - step: "Assert Amount Awarded sums both Benefit lines"
        action: "assert"
        target: "award_two"
        asserts:
          amount_awarded:
            type: "value"
            expected: 500000.0

      # ── Positive: create, state transition, funding committed ──
      - step: "Create the main award with one Benefit and one Funding line"
        action: "create"
        model: "school_scholarship_award"
        save_as: "award_main"
        values:
          program_id: "REC: program1.id"
          student_id: "REC: student1.id"
          enrollment_id: "REC: enrollment1.id"
          date_start: 2026-07-01
          date_end: 2026-12-31
          discount_account_id: "REC: discount_account1.id"
          # Owned by admin so the ``as_user: base.user_admin`` steps
          # below are not rejected by the internal_user_rule record
          # rule (test-traps.md T-05).
          user_id: "REF: base.user_admin"
          benefit_ids:
            - - 0
              - 0
              - name: "AW1 Main Benefit Line"
                product_id: "REC: product1.id"
                price_unit: 1000000.0
          funding_ids:
            - - 0
              - 0
              - funding_source_id: "REC: funding_source1.id"
                percentage: 100.0

      - step: "Assert the award was created in Draft, Active"
        action: "assert"
        target: "award_main"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          state:
            type: "value"
            expected: "draft"
          compliance_state:
            type: "value"
            expected: "active"
          amount_awarded:
            type: "value"
            expected: 1000000.0

      - step: "Confirm the award as admin"
        action: "call"
        target: "award_main"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      # ``approve_ok`` shares its compute method (``_compute_policy``)
      # with every other policy field, and that method is only
      # re-triggered by @api.depends("policy_template_id"). Confirming
      # already cached approve_ok=False (no approver existed yet), so
      # it must be busted explicitly before Approve reads it -- an
      # assert alone does not force recompute (test-traps.md pattern
      # also used by ssi_school's enrollment tests).
      - step: "Invalidate cache before approving (avoids stale policy cache)"
        action: "call"
        target: "award_main"
        method: "invalidate_cache"

      - step: "Approve the award as admin"
        action: "call"
        target: "award_main"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"
          name:
            type: "value"
            operator: "not_equals"
            expected: "/"

      - step: "Assert the funding source committed the award's amount"
        action: "assert"
        target: "funding_source1"
        asserts:
          amount_committed:
            type: "value"
            expected: 1000000.0

      - step: "Assert the program's quota used increased by one"
        action: "assert"
        target: "program1"
        asserts:
          quota_used:
            type: "value"
            expected: 1

      # ── amount_realized is a placeholder compute (@api.depends()
      # with no dependency, wired up for real in the schedule item),
      # so nothing in the normal create/confirm/approve flow above
      # ever triggers it -- call it directly to verify the documented
      # placeholder value.
      - step: "Force-compute the award's Amount Realized placeholder"
        action: "call"
        target: "award_main"
        method: "_compute_amount_realized"
        asserts:
          amount_realized:
            type: "value"
            expected: 0.0

      - step: "Find the main award's Funding line"
        action: "search"
        model: "school_scholarship_award_funding"
        domain: [["award_id", "=", "REC: award_main.id"]]
        limit: 1
        save_as: "funding_main_line"

      - step: "Force-compute the Funding line's Amount Realized placeholder"
        action: "call"
        target: "funding_main_line"
        method: "_compute_amount_realized"
        asserts:
          amount_realized:
            type: "value"
            expected: 0.0

      - step: "Force-compute the Funding Source's Amount Realized placeholder"
        action: "call"
        target: "funding_source1"
        method: "_compute_amount_realized"
        asserts:
          amount_realized:
            type: "value"
            expected: 0.0

      # ── Cancel the now-Open award via the cancel reason wizard ──
      - step: "Create the cancellation reason"
        action: "create"
        model: "base.cancel_reason"
        save_as: "reason1"
        values:
          name: "AW1 Cancel Reason"
          code: "AW1CR"

      - step: "Cancel the award via the wizard"
        action: "wizard"
        model: "base.select_cancel_reason"
        target: "award_main"
        as_user: "base.user_admin"
        values:
          cancel_reason_id: "REC: reason1.id"
        method: "action_confirm"
        asserts:
          state:
            type: "value"
            expected: "cancel"

  - name: "Award - Onchange Program And Scope"
    steps:
      # ── Shared fixture chain (suffix AW2) ────────────────────────
      - step: "Create the grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type2"
        values:
          name: "AW2 Grade Type"
          code: "AW2GT"

      - step: "Create the school"
        action: "create"
        model: "school"
        save_as: "school2"
        values:
          name: "AW2 School"
          code: "AW2SC"
          grade_type_id: "REC: grade_type2.id"

      - step: "Create the academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year2"
        values:
          name: "AW2 Academic Year"
          code: "AW2AY"
          date_start: 2026-07-01
          date_end: 2027-06-30

      - step: "Create the academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term2"
        values:
          name: "AW2 Term"
          code: "AW2TM"
          date_start: 2026-07-01
          date_end: 2026-12-31
          year_id: "REC: academic_year2.id"

      - step: "Create the grade"
        action: "create"
        model: "school_grade"
        save_as: "grade2"
        values:
          name: "AW2 Grade"
          code: "AW2GR"
          type_id: "REC: grade_type2.id"

      - step: "Create the grade class"
        action: "create"
        model: "school_grade_class"
        save_as: "grade_class2"
        values:
          name: "AW2 Class"
          code: "AW2CL"
          school_id: "REC: school2.id"
          grade_id: "REC: grade2.id"

      - step: "Create the student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact2"
        values:
          name: "AW2 Contact"

      - step: "Create the student"
        action: "create"
        model: "school_student"
        save_as: "student2"
        values:
          name: "AW2 Student"
          code: "AW2ST"
          contact_id: "REC: contact2.id"
          school_id: "REC: school2.id"

      - step: "Create the enrollment"
        action: "create"
        model: "school_enrollment"
        save_as: "enrollment2"
        values:
          academic_year_id: "REC: academic_year2.id"
          academic_term_id: "REC: academic_term2.id"
          school_id: "REC: school2.id"
          grade_id: "REC: grade2.id"
          grade_class_id: "REC: grade_class2.id"
          student_id: "REC: student2.id"

      - step: "Create the analytic account for the funding source"
        action: "create"
        model: "account.analytic.account"
        save_as: "analytic2"
        values:
          name: "AW2 Analytic"

      - step: "Create the funding source"
        action: "create"
        model: "school_scholarship_funding_source"
        save_as: "funding_source2"
        values:
          name: "AW2 Funding Source"
          code: "AW2FS"
          analytic_account_id: "REC: analytic2.id"

      - step: "Create the product covered by the scope line"
        action: "create"
        model: "product.product"
        save_as: "product2"
        values:
          name: "AW2 Product"
          type: "service"

      - step: "Create the sale journal used by the scholarship type"
        action: "create"
        model: "account.journal"
        save_as: "journal2"
        values:
          name: "AW2 Journal"
          code: "JAW2"
          type: "sale"

      - step: "Get the account.account.type Income reference"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "account_type_income"

      - step: "Create the discount account"
        action: "create"
        model: "account.account"
        save_as: "discount_account2"
        values:
          name: "AW2 Discount Account"
          code: "AW2DA"
          user_type_id: "REC: account_type_income.id"
          reconcile: false

      - step: "Create the scholarship type, flagged as employee benefit"
        action: "create"
        model: "school_scholarship_type"
        save_as: "type2"
        values:
          name: "AW2 Type"
          code: "AW2TY"
          deduction_journal_id: "REC: journal2.id"
          discount_account_id: "REC: discount_account2.id"
          is_employee_benefit: true

      - step: "Create the scholarship program"
        action: "create"
        model: "school_scholarship_program"
        save_as: "program2"
        values:
          name: "AW2 Program"
          code: "AW2PRG"
          type_id: "REC: type2.id"
          school_id: "REC: school2.id"
          academic_year_id: "REC: academic_year2.id"
          funding_source_ids: [[6, 0, ["REC: funding_source2.id"]]]
          deduction_journal_id: "REC: journal2.id"
          discount_account_id: "REC: discount_account2.id"
          # school_scholarship_program.is_employee_benefit is a plain
          # Boolean only defaulted from type_id via the Program's own
          # onchange (form UI) -- create() never triggers it, so it
          # must be set explicitly here for the Award onchange step
          # below to have something true to copy.
          is_employee_benefit: true
          scope_ids:
            - - 0
              - 0
              - scope_basis: "product"
                product_id: "REC: product2.id"
                benefit_type: "cash"
                computation: "fixed"
                percentage: 0.0
                amount_fixed: 250000.0

      - step: "Find the created scope line"
        action: "search"
        model: "school_scholarship_program_scope"
        domain: [["program_id", "=", "REC: program2.id"]]
        limit: 1
        save_as: "scope_line2"

      - step: "Create the employee benefit account"
        action: "create"
        model: "account.account"
        save_as: "employee_benefit_account2"
        values:
          name: "AW2 Employee Benefit Account"
          code: "AW2EBA"
          user_type_id: "REC: account_type_income.id"
          reconcile: false

      # ── Compute (employee benefit branch): a Benefit line on an
      # award flagged Is Employee Benefit must post to the award's
      # Employee Benefit Account, not its Discount/Expense Account --
      # every other award fixture in this file has
      # is_employee_benefit false, so this is the only place that
      # branch of _compute_account_id is exercised.
      - step: "Create an employee-benefit award with one Benefit line"
        action: "create"
        model: "school_scholarship_award"
        save_as: "award_employee_benefit"
        values:
          program_id: "REC: program2.id"
          student_id: "REC: student2.id"
          enrollment_id: "REC: enrollment2.id"
          date_start: 2026-07-01
          date_end: 2026-12-31
          is_employee_benefit: true
          employee_benefit_account_id: "REC: employee_benefit_account2.id"
          benefit_ids:
            - - 0
              - 0
              - name: "AW2 Employee Benefit Line"
                product_id: "REC: product2.id"
                price_unit: 250000.0

      - step: "Find the employee-benefit award's Benefit line"
        action: "search"
        model: "school_scholarship_award_benefit"
        domain: [["award_id", "=", "REC: award_employee_benefit.id"]]
        limit: 1
        save_as: "employee_benefit_line"

      - step: "Assert the Benefit line posts to the Employee Benefit Account"
        action: "assert"
        target: "employee_benefit_line"
        asserts:
          account_id:
            type: "m2o"
            expected: "REC: employee_benefit_account2"

      - step: "Create a bare award to host the Benefit onchange test"
        action: "create"
        model: "school_scholarship_award"
        save_as: "award2"
        values:
          program_id: "REC: program2.id"
          student_id: "REC: student2.id"
          enrollment_id: "REC: enrollment2.id"
          date_start: 2026-07-01
          date_end: 2026-12-31

      # ── Onchange (form): set program_id → nine account fields and
      # is_employee_benefit filled from the program.
      - step: "Open a new award form and select the Program"
        action: "form"
        model: "school_scholarship_award"
        save: false
        ops:
          - set:
              program_id: "REC: program2"
          - assert:
              deduction_journal_id:
                type: "m2o"
                expected: "REC: journal2"
              discount_account_id:
                type: "m2o"
                expected: "REC: discount_account2"
              is_employee_benefit:
                type: "value"
                expected: true

      # ── Onchange (form): set scope_id on a Benefit line → Benefit
      # Type, Computation, and Percentage/Fixed Amount filled from
      # that scope line.
      - step: "Open a new Benefit line form and select the Scope"
        action: "form"
        model: "school_scholarship_award_benefit"
        save: false
        ops:
          - set:
              award_id: "REC: award2"
          - set:
              scope_id: "REC: scope_line2"
          - assert:
              benefit_type:
                type: "value"
                expected: "cash"
              computation:
                type: "value"
                expected: "fixed"
              amount_fixed:
                type: "value"
                expected: 250000.0

