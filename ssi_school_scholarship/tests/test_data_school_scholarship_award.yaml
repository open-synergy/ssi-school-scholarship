        save_as: "funding_source3"
        values:
          name: "AW3 Funding Source"
          code: "AW3FS"
          analytic_account_id: "REC: analytic3.id"

      - step: "Create the product covered by the scope line"
        action: "create"
        model: "product.product"
        save_as: "product3"
        values:
          name: "AW3 Product"
          type: "service"

      - step: "Create the sale journal used by the scholarship type"
        action: "create"
        model: "account.journal"
        save_as: "journal3"
        values:
          name: "AW3 Journal"
          code: "JAW3"
          type: "sale"

      - step: "Get the account.account.type Income reference"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "account_type_income"

      - step: "Create the discount account"
        action: "create"
        model: "account.account"
        save_as: "discount_account3"
        values:
          name: "AW3 Discount Account"
          code: "AW3DA"
          user_type_id: "REC: account_type_income.id"
          reconcile: false

      - step: "Create the scholarship type"
        action: "create"
        model: "school_scholarship_type"
        save_as: "type3"
        values:
          name: "AW3 Type"
          code: "AW3TY"
          deduction_journal_id: "REC: journal3.id"
          discount_account_id: "REC: discount_account3.id"

      - step: "Create the scholarship program"
        action: "create"
        model: "school_scholarship_program"
        save_as: "program3"
        values:
          name: "AW3 Program"
          code: "AW3PRG"
          type_id: "REC: type3.id"
          school_id: "REC: school3.id"
          academic_year_id: "REC: academic_year3.id"
          funding_source_ids: [[6, 0, ["REC: funding_source3.id"]]]
          deduction_journal_id: "REC: journal3.id"
          discount_account_id: "REC: discount_account3.id"
          scope_ids:
            - - 0
              - 0
              - scope_basis: "product"
                product_id: "REC: product3.id"
                benefit_type: "fee_reduction"
                computation: "percentage"
                percentage: 40.0

      # ── Negative: Confirm without a Benefit line ─────────────────
      - step: "Create an award with Funding but no Benefit line"
        action: "create"
        model: "school_scholarship_award"
        save_as: "award_g"
        values:
          program_id: "REC: program3.id"
          student_id: "REC: student3a.id"
          enrollment_id: "REC: enrollment3a.id"
          date_start: 2026-07-01
          date_end: 2026-12-31
          discount_account_id: "REC: discount_account3.id"
          funding_ids:
            - - 0
              - 0
              - funding_source_id: "REC: funding_source3.id"
                percentage: 100.0

      - step: "Confirming without a Benefit line is rejected"
        action: "call"
        target: "award_g"
        method: "action_confirm"
        expect_error:
          type: "UserError"
          message_contains: "Benefit line"

      # ── Negative: Funding percentage does not add up to 100 ──────
      - step: "Reject an award whose Funding percentage totals 80"
        action: "create"
        model: "school_scholarship_award"
        expect_error:
          type: "ValidationError"
          message_contains: "100"
        values:
          program_id: "REC: program3.id"
          student_id: "REC: student3a.id"
          enrollment_id: "REC: enrollment3a.id"
          date_start: 2026-07-01
          date_end: 2026-12-31
          discount_account_id: "REC: discount_account3.id"
          funding_ids:
            - - 0
              - 0
              - funding_source_id: "REC: funding_source3.id"
                percentage: 80.0

      # ── Negative: two Funding lines share the same source ────────
      - step: "Reject an award with two Funding lines of the same source"
        action: "create"
        model: "school_scholarship_award"
        expect_error:
          type: "ValidationError"
          message_contains: "already used"
        values:
          program_id: "REC: program3.id"
          student_id: "REC: student3a.id"
          enrollment_id: "REC: enrollment3a.id"
          date_start: 2026-07-01
          date_end: 2026-12-31
          discount_account_id: "REC: discount_account3.id"
          funding_ids:
            - - 0
              - 0
              - funding_source_id: "REC: funding_source3.id"
                percentage: 50.0
            - - 0
              - 0
              - funding_source_id: "REC: funding_source3.id"
                percentage: 50.0

      # ── Negative: End Date earlier than Start Date ────────────────
      - step: "Reject an award whose End Date is before its Start Date"
        action: "create"
        model: "school_scholarship_award"
        expect_error:
          type: "ValidationError"
          message_contains: "earlier"
        values:
          program_id: "REC: program3.id"
          student_id: "REC: student3a.id"
          enrollment_id: "REC: enrollment3a.id"
          date_start: 2026-12-31
          date_end: 2026-07-01
          discount_account_id: "REC: discount_account3.id"
          funding_ids:
            - - 0
              - 0
              - funding_source_id: "REC: funding_source3.id"
                percentage: 100.0

      # ── Negative: Enrollment belongs to a different Student ──────
      - step: "Create a second student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact3b"
        values:
          name: "AW3 Contact B"

      - step: "Create a second student"
        action: "create"
        model: "school_student"
        save_as: "student3b"
        values:
          name: "AW3 Student B"
          code: "AW3STB"
          contact_id: "REC: contact3b.id"
          school_id: "REC: school3.id"

      - step: "Create the second student's enrollment"
        action: "create"
        model: "school_enrollment"
        save_as: "enrollment3b"
        values:
          academic_year_id: "REC: academic_year3.id"
          academic_term_id: "REC: academic_term3.id"
          school_id: "REC: school3.id"
          grade_id: "REC: grade3.id"
          grade_class_id: "REC: grade_class3.id"
          student_id: "REC: student3b.id"

      - step: "Reject an award mixing Student A with Student B's enrollment"
        action: "create"
        model: "school_scholarship_award"
        expect_error:
          type: "ValidationError"
          message_contains: "does not belong"
        values:
          program_id: "REC: program3.id"
          student_id: "REC: student3a.id"
          enrollment_id: "REC: enrollment3b.id"
          date_start: 2026-07-01
          date_end: 2026-12-31
          discount_account_id: "REC: discount_account3.id"

      # ── Negative: Award currency does not match Enrollment currency ─
      - step: "Find a currency different from the company currency"
        action: "search"
        model: "res.currency"
        # ``active_test: false`` -- most non-company currencies are
        # inactive by default, and the default search would otherwise
        # filter them all out, leaving no candidate to pick.
        context:
          active_test: false
        domain: [["id", "!=", "REC: company.currency_id.id"]]
        limit: 1
        save_as: "other_currency3"

      - step: "Create an enrollment billed in the other currency"
        action: "create"
        model: "school_enrollment"
        save_as: "enrollment3c"
        values:
          academic_year_id: "REC: academic_year3.id"
          academic_term_id: "REC: academic_term3.id"
          school_id: "REC: school3.id"
          grade_id: "REC: grade3.id"
          grade_class_id: "REC: grade_class3.id"
          student_id: "REC: student3a.id"
          currency_id: "REC: other_currency3.id"

      - step: "Reject an award whose currency does not match the enrollment"
        action: "create"
        model: "school_scholarship_award"
        expect_error:
          type: "ValidationError"
          message_contains: "currency"
        values:
          program_id: "REC: program3.id"
          student_id: "REC: student3a.id"
          enrollment_id: "REC: enrollment3c.id"
          date_start: 2026-07-01
          date_end: 2026-12-31
          discount_account_id: "REC: discount_account3.id"

      # ── Negative: Renewal Sequence exceeds Program Max Renewal ───
      - step: "Cap the program's renewal chain at one renewal"
        action: "write"
        target: "program3"
        values:
          is_renewable: true
          max_renewal: 1

      - step: "Create the original award (Renewal Sequence 0)"
        action: "create"
        model: "school_scholarship_award"
        save_as: "award_n1"
        values:
          program_id: "REC: program3.id"
          student_id: "REC: student3a.id"
          enrollment_id: "REC: enrollment3a.id"
          date_start: 2026-07-01
          date_end: 2026-12-31

      - step: "Create the first renewal (Renewal Sequence 1, allowed)"
        action: "create"
        model: "school_scholarship_award"
        save_as: "award_n2"
        values:
          program_id: "REC: program3.id"
          student_id: "REC: student3a.id"
          enrollment_id: "REC: enrollment3a.id"
          date_start: 2027-07-01
          date_end: 2027-12-31
          renewal_of_award_id: "REC: award_n1.id"

      - step: "Assert the first renewal's Renewal Sequence is 1"
        action: "assert"
        target: "award_n2"
        asserts:
          renewal_sequence:
            type: "value"
            expected: 1

      - step: "Reject a second renewal (Renewal Sequence 2 exceeds Max Renewal 1)"
        action: "create"
        model: "school_scholarship_award"
        expect_error:
          type: "ValidationError"
          message_contains: "Renewal Sequence"
        values:
          program_id: "REC: program3.id"
          student_id: "REC: student3a.id"
          enrollment_id: "REC: enrollment3a.id"
          date_start: 2028-07-01
          date_end: 2028-12-31
          renewal_of_award_id: "REC: award_n2.id"
