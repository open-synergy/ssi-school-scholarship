        action: "search"
        model: "school_scholarship_program_scope"
        domain:
          [["program_id", "=", "REC: program_ab.id"], ["scope_basis", "=", "product"]]
        limit: 1
        save_as: "scope_product_ab"

      - step: "Find the created Product-Category-based scope line"
        action: "search"
        model: "school_scholarship_program_scope"
        domain:
