scenarios:
  - name: "Criteria - Create Manual Hard Requirement"
    steps:
      - step: "Get the account.account.type Income reference"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "account_type_income"

      - step: "Create the sale journal used by the scholarship type"
        action: "create"
        model: "account.journal"
        save_as: "sale_journal"
        values:
          name: "Test Criteria Sale Journal 1"
          code: "TCRJ01"
          type: "sale"

      - step: "Create the discount account used by the scholarship type"
        action: "create"
        model: "account.account"
        save_as: "discount_account"
        values:
          name: "Test Criteria Discount Account 1"
          code: "TCRA01"
          user_type_id: "REC: account_type_income.id"
          reconcile: false

      - step: "Create the scholarship type"
        action: "create"
        model: "school_scholarship_type"
        save_as: "type"
        values:
          name: "Test Criteria Type 1"
          code: "TCRT01"
          deduction_journal_id: "REC: sale_journal.id"
          discount_account_id: "REC: discount_account.id"

      - step: "Create the grade type used by the school"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Test Criteria Grade Type 1"
          code: "TCRGT01"

      - step: "Create the school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "Test Criteria School 1"
          code: "TCRS01"
          grade_type_id: "REC: grade_type.id"

      - step: "Create the academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year"
        values:
          name: "Test Criteria Academic Year 1"
          code: "TCRY01"
          date_start: 2026-07-01
          date_end: 2027-06-30

      - step: "Create the analytic account for the funding source"
        action: "create"
        model: "account.analytic.account"
        save_as: "analytic_account"
        values:
          name: "Test Criteria Analytic 1"

      - step: "Create the funding source"
        action: "create"
        model: "school_scholarship_funding_source"
        save_as: "funding_source"
        values:
          name: "Test Criteria Funding Source 1"
          code: "TCRF01"
          analytic_account_id: "REC: analytic_account.id"

      - step: "Create the product covered by the baseline scope line"
        action: "create"
        model: "product.product"
        save_as: "product"
        values:
          name: "Test Criteria Product 1"
          type: "service"

      - step: "Create the scholarship program with a baseline scope line"
        action: "create"
        model: "school_scholarship_program"
        save_as: "program"
        values:
          name: "Test Criteria Program 1"
          code: "TCRP001"
          type_id: "REC: type.id"
          school_id: "REC: school.id"
          academic_year_id: "REC: academic_year.id"
          funding_source_ids: [[6, 0, ["REC: funding_source.id"]]]
          deduction_journal_id: "REC: sale_journal.id"
          discount_account_id: "REC: discount_account.id"
          scope_ids:
            - - 0
              - 0
              - scope_basis: "product"
                product_id: "REC: product.id"
                benefit_type: "fee_reduction"
                computation: "percentage"
                percentage: 40.0

      - step: "Create a manual hard requirement criterion"
        action: "create"
        model: "school_scholarship_criteria"
        save_as: "criteria"
        values:
          program_id: "REC: program.id"
          name: "Household income below threshold"
          evaluation_method: "manual"
          is_hard_requirement: true

      - step: "Assert the criterion was created"
        action: "assert"
        target: "criteria"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          evaluation_method:
            type: "value"
            expected: "manual"
          is_hard_requirement:
            type: "value"
            expected: true

