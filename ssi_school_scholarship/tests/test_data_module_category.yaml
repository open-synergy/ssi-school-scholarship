scenarios:
  - name: "Award workflow/data ownership groups point to their own model category"
    steps:
      - step: "Get school_scholarship_award_viewer_group by XML ID"
        action: "ref"
        xml_id: "ssi_school_scholarship.school_scholarship_award_viewer_group"
        save_as: "award_viewer_group"
      - step: "Get school_scholarship_award_user_group by XML ID"
        action: "ref"
        xml_id: "ssi_school_scholarship.school_scholarship_award_user_group"
        save_as: "award_user_group"
      - step: "Get school_scholarship_award_validator_group by XML ID"
        action: "ref"
        xml_id: "ssi_school_scholarship.school_scholarship_award_validator_group"
        save_as: "award_validator_group"
      - step: "Get school_scholarship_award_company_group by XML ID"
        action: "ref"
        xml_id: "ssi_school_scholarship.school_scholarship_award_company_group"
        save_as: "award_company_group"
      - step: "Get school_scholarship_award_company_child_group by XML ID"
        action: "ref"
        xml_id: "ssi_school_scholarship.school_scholarship_award_company_child_group"
        save_as: "award_company_child_group"
      - step: "Get school_scholarship_award_all_group by XML ID"
        action: "ref"
        xml_id: "ssi_school_scholarship.school_scholarship_award_all_group"
        save_as: "award_all_group"
      - step: "Assert award_viewer_group category_id and literal name"
        action: "assert"
        target: "award_viewer_group"
        asserts:
          category_id:
            type: "m2o"
            expected_xml_id: "ssi_school_scholarship.school_scholarship_award_workflow_module_category"
          name:
            type: "value"
            expected: "Viewer"
      - step: "Assert award_user_group category_id and literal name"
        action: "assert"
        target: "award_user_group"
        asserts:
          category_id:
            type: "m2o"
            expected_xml_id: "ssi_school_scholarship.school_scholarship_award_workflow_module_category"
          name:
            type: "value"
            expected: "User"
      - step: "Assert award_validator_group category_id and literal name"
        action: "assert"
        target: "award_validator_group"
        asserts:
          category_id:
            type: "m2o"
            expected_xml_id: "ssi_school_scholarship.school_scholarship_award_workflow_module_category"
          name:
            type: "value"
            expected: "Validator"
      - step: "Assert award_company_group category_id and literal name"
        action: "assert"
        target: "award_company_group"
        asserts:
          category_id:
            type: "m2o"
            expected_xml_id: "ssi_school_scholarship.school_scholarship_award_data_ownership_module_category"
          name:
            type: "value"
            expected: "Company"
      - step: "Assert award_company_child_group category_id and literal name"
        action: "assert"
        target: "award_company_child_group"
        asserts:
          category_id:
            type: "m2o"
            expected_xml_id: "ssi_school_scholarship.school_scholarship_award_data_ownership_module_category"
          name:
            type: "value"
            expected: "Company and All Child Companies"
      - step: "Assert award_all_group category_id and literal name"
        action: "assert"
        target: "award_all_group"
        asserts:
          category_id:
            type: "m2o"
            expected_xml_id: "ssi_school_scholarship.school_scholarship_award_data_ownership_module_category"
          name:
            type: "value"
            expected: "All"

  - name: "Award categories are now parented under ssi_school's shared categories"
    steps:
      - step: "Get school_scholarship_award_workflow_module_category by XML ID"
        action: "ref"
        xml_id: "ssi_school_scholarship.school_scholarship_award_workflow_module_category"
        save_as: "award_workflow_category"
      - step: "Get school_scholarship_award_data_ownership_module_category by XML ID"
        action: "ref"
        xml_id: "ssi_school_scholarship.school_scholarship_award_data_ownership_module_category"
        save_as: "award_data_ownership_category"
      - step: "Assert award_workflow_category parent_id and name"
        action: "assert"
        target: "award_workflow_category"
        asserts:
          parent_id:
            type: "m2o"
            expected_xml_id: "ssi_school.school_workflow_module_category"
          name:
            type: "value"
            expected: "Scholarship Award"
      - step: "Assert award_data_ownership_category parent_id and name"
        action: "assert"
        target: "award_data_ownership_category"
        asserts:
          parent_id:
            type: "m2o"
            expected_xml_id: "ssi_school.school_data_ownership_module_category"
          name:
            type: "value"
            expected: "Scholarship Award"

  - name:
      "Configurator groups are now parented under ssi_school's configurator category"
    steps:
      - step: "Get school_scholarship_type_group by XML ID"
        action: "ref"
        xml_id: "ssi_school_scholarship.school_scholarship_type_group"
        save_as: "type_group"
      - step: "Get school_scholarship_program_group by XML ID"
        action: "ref"
        xml_id: "ssi_school_scholarship.school_scholarship_program_group"
        save_as: "program_group"
      - step: "Get school_scholarship_funding_source_group by XML ID"
        action: "ref"
        xml_id: "ssi_school_scholarship.school_scholarship_funding_source_group"
        save_as: "funding_source_group"
      - step: "Assert type_group category_id"
        action: "assert"
        target: "type_group"
        asserts:
          category_id:
            type: "m2o"
            expected_xml_id: "ssi_school.school_configurator_module_category"
      - step: "Assert program_group category_id"
        action: "assert"
        target: "program_group"
        asserts:
          category_id:
            type: "m2o"
            expected_xml_id: "ssi_school.school_configurator_module_category"
      - step: "Assert funding_source_group category_id"
        action: "assert"
        target: "funding_source_group"
        asserts:
          category_id:
            type: "m2o"
            expected_xml_id: "ssi_school.school_configurator_module_category"

  - name:
      "The module's own root/configurator/workflow/data ownership categories are gone"
    steps:
      # `env.ref()` (action: ref) does not honor `expect_error` (odoo-yaml-test
      # L-24: silently ignored on `ref`/`search`/`assert`), so a raised
      # ValueError here would surface as an unhandled step error instead of a
      # deliberate negative assertion. Proving deletion via `ir.model.data`
      # stays fully inside YAML and is strictly stronger: it is the exact
      # record `ir.model.data._process_end()` removes, and `env.ref()`
      # failure is a direct consequence of its absence.
      - step:
          "Search ir.model.data for the four XML IDs removed from
          ir_module_category_data.xml"
        action: "search"
        model: "ir.model.data"
        domain:
          [
            ["module", "=", "ssi_school_scholarship"],
            [
              "name",
              "in",
              [
                "school_scholarship_module_category",
                "school_scholarship_configurator_module_category",
                "school_scholarship_workflow_module_category",
                "school_scholarship_data_ownership_module_category",
              ],
            ],
          ]
        save_as: "removed_category_data"
        expect_count: 0
