          partner_id: "REC: ou2_b_partner.id"

      - step: "Create the grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type2"
        values:
          name: "AWADMOU2 Grade Type"
          code: "AWADMOU2GT"

      - step: "Create School A with Operating Unit A"
        action: "create"
        model: "school"
        save_as: "school2_a"
        values:
          name: "AWADMOU2 School A"
          code: "AWADMOU2SCA"
          grade_type_id: "REC: grade_type2.id"
          operating_unit_ids: [[6, 0, ["REC: ou2_a.id"]]]

      - step: "Create School B with Operating Unit B"
        action: "create"
        model: "school"
        save_as: "school2_b"
        values:
          name: "AWADMOU2 School B"
          code: "AWADMOU2SCB"
          grade_type_id: "REC: grade_type2.id"
          operating_unit_ids: [[6, 0, ["REC: ou2_b.id"]]]

      - step: "Create the grade"
        action: "create"
        model: "school_grade"
        save_as: "grade2"
        values:
          name: "AWADMOU2 Grade"
          code: "AWADMOU2GR"
          type_id: "REC: grade_type2.id"

      - step: "Create the academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year2"
        values:
          name: "AWADMOU2 Academic Year"
          code: "AWADMOU2AY"
          date_start: 2026-07-01
          date_end: 2027-06-30

      - step: "Create the academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term2"
        values:
          name: "AWADMOU2 Term"
          code: "AWADMOU2TM"
          date_start: 2026-07-01
          date_end: 2026-12-31
          year_id: "REC: academic_year2.id"

      - step: "Create Admission A's contact"
        action: "create"
        model: "res.partner"
        save_as: "admission_contact2_a"
        values:
          name: "AWADMOU2 Admission Contact A"

      - step: "Create Admission A (School A)"
        action: "create"
        model: "school_admission"
        save_as: "admission2_a"
        values:
          academic_year_id: "REC: academic_year2.id"
          academic_term_id: "REC: academic_term2.id"
          school_id: "REC: school2_a.id"
          grade_id: "REC: grade2.id"
          student_id: "REC: admission_contact2_a.id"
          user_id: "REF: base.user_admin"

      - step: "Confirm Admission A as admin"
        action: "call"
        target: "admission2_a"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve Admission A as admin (auto-opens)"
        action: "call"
        target: "admission2_a"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Create Admission B's contact"
        action: "create"
        model: "res.partner"
        save_as: "admission_contact2_b"
        values:
          name: "AWADMOU2 Admission Contact B"

      - step: "Create Admission B (School B)"
        action: "create"
        model: "school_admission"
        save_as: "admission2_b"
        values:
          academic_year_id: "REC: academic_year2.id"
