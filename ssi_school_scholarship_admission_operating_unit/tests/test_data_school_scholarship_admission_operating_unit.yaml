        target: "admission2_b"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve Admission B as admin (auto-opens)"
        action: "call"
        target: "admission2_b"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Create the analytic account for the funding source"
        action: "create"
        model: "account.analytic.account"
        save_as: "analytic2"
        values:
          name: "AWADMOU2 Analytic"

      - step: "Create the funding source"
        action: "create"
        model: "school_scholarship_funding_source"
        save_as: "funding_source2"
        values:
          name: "AWADMOU2 Funding Source"
          code: "AWADMOU2FS"
          analytic_account_id: "REC: analytic2.id"

      - step: "Create the product covered by the Benefit line"
        action: "create"
        model: "product.product"
        save_as: "product2"
        values:
          name: "AWADMOU2 Product"
          type: "service"

      - step: "Create the sale journal used by the scholarship type"
        action: "create"
        model: "account.journal"
        save_as: "journal2"
        values:
          name: "AWADMOU2 Journal"
          code: "JAWADMOU2"
          type: "sale"

      - step: "Get the account.account.type Income reference"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "account_type_income2"

      - step: "Create the discount account"
        action: "create"
        model: "account.account"
        save_as: "discount_account2"
        values:
          name: "AWADMOU2 Discount Account"
          code: "AWADMOU2DA"
          user_type_id: "REC: account_type_income2.id"
          reconcile: false

      - step:
          "Create the scholarship type (tied to School A, unrelated to the award's
          eventual School B)"
        action: "create"
        model: "school_scholarship_type"
        save_as: "type2"
        values:
          name: "AWADMOU2 Type"
          code: "AWADMOU2TY"
          deduction_journal_id: "REC: journal2.id"
          discount_account_id: "REC: discount_account2.id"

      - step: "Create the scholarship program (tied to School A)"
        action: "create"
        model: "school_scholarship_program"
        save_as: "program2"
        values:
          name: "AWADMOU2 Program"
          code: "AWADMOU2PRG"
          type_id: "REC: type2.id"
          school_id: "REC: school2_a.id"
          academic_year_id: "REC: academic_year2.id"
          funding_source_ids: [[6, 0, ["REC: funding_source2.id"]]]
          deduction_journal_id: "REC: journal2.id"
          discount_account_id: "REC: discount_account2.id"
          scope_ids:
            - - 0
              - 0
              - scope_basis: "product"
                product_id: "REC: product2.id"
                benefit_type: "fee_reduction"
                computation: "percentage"
                percentage: 40.0

      - step: "Create the award for Admission A (School A)"
        action: "create"
        model: "school_scholarship_award"
        save_as: "award2"
        values:
          program_id: "REC: program2.id"
          source_type: "admission"
          admission_id: "REC: admission2_a.id"
          student_id: "REC: admission2_a.school_student_id.id"
          date_start: 2026-07-01
          date_end: 2026-12-31
          discount_account_id: "REC: discount_account2.id"

      - step: "Assert operating unit was derived from School A"
        action: "assert"
        target: "award2"
        asserts:
          operating_unit_id:
            type: "m2o"
            expected: "REC: ou2_a"

      - step: "Write admission_id to Admission B (School B)"
        action: "write"
        target: "award2"
        values:
          admission_id: "REC: admission2_b.id"
          student_id: "REC: admission2_b.school_student_id.id"

      - step: "Assert operating unit moved to School B"
        action: "assert"
        target: "award2"
        asserts:
          operating_unit_id:
            type: "m2o"
            expected: "REC: ou2_b"

  - name: "Award Admission OU - explicit operating_unit_id is never overridden"
