options:
  auto_refresh: true
scenarios:
  - name:
      "Award Admission OU - create derives operating_unit_id from Admission's School"
    steps:
      # ── Shared fixture chain (suffix AWADMOU1) ───────────────────
      - step: "Create partner for the school's own operating unit"
        action: "create"
        model: "res.partner"
        save_as: "ou1_partner"
        values:
          name: "Award Admission OU1 Partner"

      - step: "Create the school's own operating unit"
        action: "create"
        model: "operating.unit"
        save_as: "ou1"
        values:
          name: "Award Admission OU1"
          code: "AWADMOU1"
          company_id: "REF: base.main_company"
          partner_id: "REC: ou1_partner.id"

      - step: "Create the grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type1"
        values:
          name: "AWADMOU1 Grade Type"
          code: "AWADMOU1GT"

      - step: "Create the school with exactly one operating unit"
        action: "create"
        model: "school"
        save_as: "school1"
        values:
          name: "AWADMOU1 School"
          code: "AWADMOU1SC"
          grade_type_id: "REC: grade_type1.id"
          operating_unit_ids: [[6, 0, ["REC: ou1.id"]]]

      - step: "Create the grade"
        action: "create"
        model: "school_grade"
        save_as: "grade1"
        values:
          name: "AWADMOU1 Grade"
          code: "AWADMOU1GR"
          type_id: "REC: grade_type1.id"

      - step: "Create the academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year1"
        values:
          name: "AWADMOU1 Academic Year"
          code: "AWADMOU1AY"
          date_start: 2026-07-01
          date_end: 2027-06-30

      - step: "Create the academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term1"
        values:
          name: "AWADMOU1 Term"
          code: "AWADMOU1TM"
          date_start: 2026-07-01
          date_end: 2026-12-31
          year_id: "REC: academic_year1.id"

      - step: "Create the admission student's contact"
        action: "create"
        model: "res.partner"
        save_as: "admission_contact1"
        values:
          name: "AWADMOU1 Admission Contact"

      - step: "Create the admission"
        action: "create"
        model: "school_admission"
        save_as: "admission1"
        values:
          academic_year_id: "REC: academic_year1.id"
          academic_term_id: "REC: academic_term1.id"
          school_id: "REC: school1.id"
          grade_id: "REC: grade1.id"
          student_id: "REC: admission_contact1.id"
          user_id: "REF: base.user_admin"

      - step: "Confirm the admission as admin"
        action: "call"
        target: "admission1"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve the admission as admin (auto-opens)"
        action: "call"
        target: "admission1"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Create the analytic account for the funding source"
        action: "create"
        model: "account.analytic.account"
        save_as: "analytic1"
        values:
          name: "AWADMOU1 Analytic"

      - step: "Create the funding source"
        action: "create"
        model: "school_scholarship_funding_source"
        save_as: "funding_source1"
        values:
          name: "AWADMOU1 Funding Source"
          code: "AWADMOU1FS"
          analytic_account_id: "REC: analytic1.id"

      - step: "Create the product covered by the Benefit line"
        action: "create"
        model: "product.product"
        save_as: "product1"
        values:
          name: "AWADMOU1 Product"
          type: "service"

      - step: "Create the sale journal used by the scholarship type"
        action: "create"
        model: "account.journal"
        save_as: "journal1"
        values:
          name: "AWADMOU1 Journal"
          code: "JAWADMOU1"
          type: "sale"

      - step: "Get the account.account.type Income reference"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "account_type_income"

      - step: "Create the discount account"
        action: "create"
        model: "account.account"
        save_as: "discount_account1"
        values:
          name: "AWADMOU1 Discount Account"
          code: "AWADMOU1DA"
          user_type_id: "REC: account_type_income.id"
          reconcile: false

      - step: "Create the scholarship type"
        action: "create"
        model: "school_scholarship_type"
        save_as: "type1"
        values:
          name: "AWADMOU1 Type"
          code: "AWADMOU1TY"
          deduction_journal_id: "REC: journal1.id"
          discount_account_id: "REC: discount_account1.id"

      - step: "Create the scholarship program"
        action: "create"
        model: "school_scholarship_program"
        save_as: "program1"
        values:
          name: "AWADMOU1 Program"
          code: "AWADMOU1PRG"
          type_id: "REC: type1.id"
          school_id: "REC: school1.id"
          academic_year_id: "REC: academic_year1.id"
          funding_source_ids: [[6, 0, ["REC: funding_source1.id"]]]
          deduction_journal_id: "REC: journal1.id"
          discount_account_id: "REC: discount_account1.id"
          scope_ids:
            - - 0
              - 0
              - scope_basis: "product"
                product_id: "REC: product1.id"
                benefit_type: "fee_reduction"
                computation: "percentage"
                percentage: 40.0

      - step: "Create the Admission-sourced award, no explicit operating unit"
        action: "create"
        model: "school_scholarship_award"
        save_as: "award1"
        values:
          program_id: "REC: program1.id"
          source_type: "admission"
          admission_id: "REC: admission1.id"
          student_id: "REC: admission1.school_student_id.id"
          date_start: 2026-07-01
          date_end: 2026-12-31
          discount_account_id: "REC: discount_account1.id"
          user_id: "REF: base.user_admin"
          benefit_ids:
            - - 0
              - 0
              - name: "AWADMOU1 Benefit Line"
                product_id: "REC: product1.id"
                percentage: 40.0
          funding_ids:
            - - 0
              - 0
              - funding_source_id: "REC: funding_source1.id"
                percentage: 100.0

      - step: "Assert operating unit was derived from the Admission's School"
        action: "assert"
        target: "award1"
        asserts:
          operating_unit_id:
            type: "m2o"
            expected: "REC: ou1"

  - name: "Award Admission OU - write changing admission_id moves operating_unit_id"
    steps:
      # ── Shared fixture chain (suffix AWADMOU2) ───────────────────
      - step: "Create partner for Operating Unit A"
        action: "create"
        model: "res.partner"
        save_as: "ou2_a_partner"
