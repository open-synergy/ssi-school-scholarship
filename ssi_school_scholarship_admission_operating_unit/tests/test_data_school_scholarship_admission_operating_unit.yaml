          name: "Award Admission Write OU A Partner"

      - step: "Create Operating Unit A"
        action: "create"
        model: "operating.unit"
        save_as: "ou2_a"
        values:
          name: "Award Admission Write OU A"
          code: "AWADMOU2A"
          company_id: "REF: base.main_company"
          partner_id: "REC: ou2_a_partner.id"

      - step: "Create partner for Operating Unit B"
