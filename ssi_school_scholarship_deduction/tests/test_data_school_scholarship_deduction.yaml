scenarios:
  - name: "Deduction - Create, Compute, Workflow, Reconcile, And Cancel"
    steps:
      # ── Shared fixture chain (suffix D1) ─────────────────────────
      - step: "Create the grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "d1_grade_type"
        values:
          name: "D1 Grade Type"
          code: "D1GT"

      - step: "Create the school"
        action: "create"
        model: "school"
        save_as: "d1_school"
        values:
          name: "D1 School"
          code: "D1SC"
          grade_type_id: "REC: d1_grade_type.id"

      - step: "Create the academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "d1_academic_year"
        values:
          name: "D1 Academic Year"
          code: "D1AY"
          date_start: 2026-07-01
          date_end: 2027-06-30

      - step: "Create the academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "d1_academic_term"
        values:
          name: "D1 Term"
          code: "D1TM"
          date_start: 2026-07-01
          date_end: 2026-12-31
          year_id: "REC: d1_academic_year.id"

      - step: "Create the grade"
        action: "create"
        model: "school_grade"
        save_as: "d1_grade"
        values:
          name: "D1 Grade"
          code: "D1GR"
          type_id: "REC: d1_grade_type.id"

      - step: "Create the grade class"
        action: "create"
        model: "school_grade_class"
        save_as: "d1_grade_class"
        values:
          name: "D1 Class"
          code: "D1CL"
          school_id: "REC: d1_school.id"
          grade_id: "REC: d1_grade.id"

      - step: "Create the student contact"
        action: "create"
        model: "res.partner"
        save_as: "d1_contact"
        values:
          name: "D1 Contact"

      - step: "Create the student"
        action: "create"
        model: "school_student"
        save_as: "d1_student"
        values:
          name: "D1 Student"
          code: "D1ST"
          contact_id: "REC: d1_contact.id"
          school_id: "REC: d1_school.id"

      - step: "Create the enrollment"
        action: "create"
        model: "school_enrollment"
        save_as: "d1_enrollment"
        values:
          academic_year_id: "REC: d1_academic_year.id"
          academic_term_id: "REC: d1_academic_term.id"
          school_id: "REC: d1_school.id"
          grade_id: "REC: d1_grade.id"
          grade_class_id: "REC: d1_grade_class.id"
          student_id: "REC: d1_student.id"

      - step: "Create the analytic account for funding source A"
        action: "create"
        model: "account.analytic.account"
        save_as: "d1_analytic_a"
        values:
          name: "D1 Analytic A"

      - step: "Create the analytic account for funding source B"
        action: "create"
        model: "account.analytic.account"
        save_as: "d1_analytic_b"
        values:
          name: "D1 Analytic B"

      - step: "Create funding source A"
        action: "create"
        model: "school_scholarship_funding_source"
        save_as: "d1_funding_source_a"
        values:
          name: "D1 Funding Source A"
          code: "D1FSA"
          analytic_account_id: "REC: d1_analytic_a.id"

      - step: "Create funding source B"
        action: "create"
        model: "school_scholarship_funding_source"
        save_as: "d1_funding_source_b"
        values:
          name: "D1 Funding Source B"
          code: "D1FSB"
          analytic_account_id: "REC: d1_analytic_b.id"

      - step: "Create the product covered by the benefit lines"
        action: "create"
        model: "product.product"
        save_as: "d1_product"
        values:
          name: "D1 Product"
          type: "service"

      - step: "Create the sale journal"
        action: "create"
        model: "account.journal"
        save_as: "d1_journal"
        values:
          name: "D1 Journal"
          code: "JD1"
          type: "sale"

      - step: "Get the account.account.type Income reference"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "account_type_income"

      - step: "Get the account.account.type Receivable reference"
        action: "ref"
        xml_id: "account.data_account_type_receivable"
        save_as: "account_type_receivable"

      - step: "Create the receivable account shared by the invoices and deductions"
        action: "create"
        model: "account.account"
        save_as: "d1_receivable_account"
        values:
          name: "D1 Receivable Account"
          code: "D1RA"
          user_type_id: "REC: account_type_receivable.id"
          reconcile: true

      - step: "Create the discount account the deduction lines post to"
        action: "create"
        model: "account.account"
        save_as: "d1_discount_account"
        values:
          name: "D1 Discount Account"
          code: "D1DA"
          user_type_id: "REC: account_type_income.id"
          reconcile: false

      - step: "Create the income account the invoice lines post to"
        action: "create"
        model: "account.account"
        save_as: "d1_income_account"
        values:
          name: "D1 Income Account"
          code: "D1IA"
          user_type_id: "REC: account_type_income.id"
          reconcile: false

      - step: "Create the customer invoice type"
        action: "create"
        model: "customer_invoice_type"
        save_as: "d1_invoice_type"
        values:
          name: "D1 Invoice Type"
          code: "/"
          journal_id: "REC: d1_journal.id"
          receivable_account_id: "REC: d1_receivable_account.id"

      - step: "Create the scholarship type"
        action: "create"
        model: "school_scholarship_type"
        save_as: "d1_type"
        values:
          name: "D1 Type"
          code: "D1TY"
          deduction_journal_id: "REC: d1_journal.id"
          discount_account_id: "REC: d1_discount_account.id"

      - step: "Create the scholarship program"
        action: "create"
        model: "school_scholarship_program"
        save_as: "d1_program"
        values:
          name: "D1 Program"
          code: "D1PRG"
          type_id: "REC: d1_type.id"
          school_id: "REC: d1_school.id"
          academic_year_id: "REC: d1_academic_year.id"
          funding_source_ids:
            [[6, 0, ["REC: d1_funding_source_a.id", "REC: d1_funding_source_b.id"]]]
          deduction_journal_id: "REC: d1_journal.id"
          discount_account_id: "REC: d1_discount_account.id"
          scope_ids:
            - - 0
              - 0
              - scope_basis: "product"
                product_id: "REC: d1_product.id"
                benefit_type: "cash"
                computation: "fixed"
                percentage: 0.0
                amount_fixed: 100000.0

      # ── Positive (transition state / reconcile, partial): 400000
      # deduction against a 1000000 invoice ──────────────────────────
      - step: "Create the award backing the partial deduction"
        action: "create"
        model: "school_scholarship_award"
        save_as: "d1_award_partial"
        values:
          program_id: "REC: d1_program.id"
          student_id: "REC: d1_student.id"
          enrollment_id: "REC: d1_enrollment.id"
          date_start: 2026-07-01
          date_end: 2026-12-31
          benefit_ids:
            - - 0
              - 0
              - name: "D1 Partial Benefit"
                product_id: "REC: d1_product.id"
                benefit_type: "cash"
                computation: "fixed"
                amount_fixed: 400000.0
                periodicity: "one_time"
          funding_ids:
            - - 0
              - 0
              - funding_source_id: "REC: d1_funding_source_a.id"
                percentage: 100.0

      - step: "Find the partial award's Benefit line"
        action: "search"
        model: "school_scholarship_award_benefit"
        domain: [["award_id", "=", "REC: d1_award_partial.id"]]
        limit: 1
        save_as: "d1_benefit_partial"

      - step: "Find the partial award's Funding line"
        action: "search"
        model: "school_scholarship_award_funding"
        domain: [["award_id", "=", "REC: d1_award_partial.id"]]
        limit: 1
        save_as: "d1_funding_partial"

      - step: "Create the Schedule line realizing the partial Benefit"
        action: "create"
        model: "school_scholarship_award_schedule"
        save_as: "d1_schedule_partial"
        values:
          benefit_id: "REC: d1_benefit_partial.id"
          date: 2026-08-01
          state: "scheduled"

      - step: "Assert the Schedule line's Amount Planned matches the fixed amount"
        action: "assert"
        target: "d1_schedule_partial"
        asserts:
          amount_planned:
            type: "value"
            expected: 400000.0

      - step: "Create the invoice the partial deduction is allocated against"
        action: "create"
        model: "customer_invoice"
        save_as: "d1_invoice_partial"
        values:
          type_id: "REC: d1_invoice_type.id"
          partner_id: "REC: d1_contact.id"
          date: 2026-08-01
          date_due: 2026-08-15
          currency_id: "REC: company.currency_id.id"
          journal_id: "REC: d1_journal.id"
          receivable_account_id: "REC: d1_receivable_account.id"
          user_id: "REF: base.user_admin"

      - step: "Add a detail line to the partial invoice"
        action: "create"
        model: "customer_invoice.line"
        save_as: "d1_invoice_partial_line"
        values:
          customer_invoice_id: "REC: d1_invoice_partial.id"
          name: "D1 Partial Invoice Line"
          account_id: "REC: d1_income_account.id"
          uom_quantity: 1
          price_unit: 1000000.0

      - step: "Confirm the partial invoice"
        action: "call"
        target: "d1_invoice_partial"
        method: "action_confirm"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve the partial invoice and post its journal entry"
        action: "call"
        target: "d1_invoice_partial"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "open"
          amount_residual:
            type: "value"
            expected: 1000000.0

      - step: "Create the partial deduction document"
        action: "create"
        model: "school_scholarship_deduction"
        save_as: "d1_deduction_partial"
        values:
          award_id: "REC: d1_award_partial.id"
          date: 2026-08-05
          journal_id: "REC: d1_journal.id"
          receivable_account_id: "REC: d1_receivable_account.id"
          user_id: "REF: base.user_admin"
          line_ids:
            - - 0
              - 0
              - schedule_id: "REC: d1_schedule_partial.id"
                funding_id: "REC: d1_funding_partial.id"
                final_account_id: "REC: d1_discount_account.id"
                name: "D1 Partial Deduction Line"
                uom_quantity: 1
                price_unit: 400000.0
          allocation_ids:
            - - 0
              - 0
              - customer_invoice_id: "REC: d1_invoice_partial.id"
                amount_allocated: 400000.0

      - step: "Assert the partial deduction's computed amounts before opening"
        action: "assert"
        target: "d1_deduction_partial"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          state:
            type: "value"
            expected: "draft"
          amount_total:
            type: "value"
            expected: 400000.0
          amount_allocated:
            type: "value"
            expected: 400000.0
          amount_unallocated:
            type: "value"
            expected: 0.0

      - step: "Confirm the partial deduction as admin"
        action: "call"
        target: "d1_deduction_partial"
        method: "action_confirm"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Invalidate cache before approving (avoids stale policy cache)"
        action: "call"
        target: "d1_deduction_partial"
        method: "invalidate_cache"

      - step: "Approve the partial deduction, opening it"
        action: "call"
        target: "d1_deduction_partial"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "open"
          move_id:
            type: "value"
            operator: "is_truthy"
          receivable_move_line_id:
            type: "value"
            operator: "is_truthy"

      - step: "Assert the partial invoice's residual dropped by the deduction"
        action: "assert"
        target: "d1_invoice_partial"
        refresh: true
        asserts:
          amount_residual:
            type: "value"
            expected: 600000.0
          realized:
            type: "value"
            expected: false

      - step: "Assert the realized Schedule line changed state"
        action: "assert"
        target: "d1_schedule_partial"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "realized"

      - step: "Create the cancellation reason"
        action: "create"
        model: "base.cancel_reason"
        save_as: "d1_reason"
        values:
          name: "D1 Cancel Reason"
          code: "D1CR"

      - step: "Cancel the partial deduction via the wizard"
        action: "wizard"
        model: "base.select_cancel_reason"
        target: "d1_deduction_partial"
        as_user: "base.user_admin"
        values:
          cancel_reason_id: "REC: d1_reason.id"
        method: "action_confirm"
        asserts:
          state:
            type: "value"
            expected: "cancel"

      - step: "Assert cancelling reversed the reconciliation and the schedule"
        action: "assert"
        target: "d1_deduction_partial"
        refresh: true
        asserts:
          move_id:
            type: "value"
            operator: "is_falsy"

      - step: "Assert cancelling restored the invoice's full residual"
        action: "assert"
        target: "d1_invoice_partial"
        refresh: true
        asserts:
          amount_residual:
            type: "value"
            expected: 1000000.0

      - step: "Assert cancelling reset the Schedule line back to scheduled"
        action: "assert"
        target: "d1_schedule_partial"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "scheduled"

      # ── Positive: full allocation fully reconciles the invoice ────
      - step: "Create the award backing the full deduction"
        action: "create"
        model: "school_scholarship_award"
        save_as: "d1_award_full"
        values:
          program_id: "REC: d1_program.id"
          student_id: "REC: d1_student.id"
          enrollment_id: "REC: d1_enrollment.id"
          date_start: 2026-07-01
          date_end: 2026-12-31
          benefit_ids:
            - - 0
              - 0
              - name: "D1 Full Benefit"
                product_id: "REC: d1_product.id"
                benefit_type: "cash"
                computation: "fixed"
                amount_fixed: 1000000.0
                periodicity: "one_time"
          funding_ids:
            - - 0
              - 0
              - funding_source_id: "REC: d1_funding_source_a.id"
                percentage: 100.0

      - step: "Find the full award's Benefit line"
        action: "search"
        model: "school_scholarship_award_benefit"
        domain: [["award_id", "=", "REC: d1_award_full.id"]]
        limit: 1
        save_as: "d1_benefit_full"

      - step: "Find the full award's Funding line"
        action: "search"
        model: "school_scholarship_award_funding"
        domain: [["award_id", "=", "REC: d1_award_full.id"]]
        limit: 1
        save_as: "d1_funding_full"

      - step: "Create the Schedule line realizing the full Benefit"
        action: "create"
        model: "school_scholarship_award_schedule"
        save_as: "d1_schedule_full"
        values:
          benefit_id: "REC: d1_benefit_full.id"
          date: 2026-08-01
          state: "scheduled"

      - step: "Create the invoice the full deduction is allocated against"
        action: "create"
        model: "customer_invoice"
        save_as: "d1_invoice_full"
        values:
          type_id: "REC: d1_invoice_type.id"
          partner_id: "REC: d1_contact.id"
          date: 2026-08-01
          date_due: 2026-08-15
          currency_id: "REC: company.currency_id.id"
          journal_id: "REC: d1_journal.id"
          receivable_account_id: "REC: d1_receivable_account.id"
          user_id: "REF: base.user_admin"

      - step: "Add a detail line to the full invoice"
        action: "create"
        model: "customer_invoice.line"
        save_as: "d1_invoice_full_line"
        values:
          customer_invoice_id: "REC: d1_invoice_full.id"
          name: "D1 Full Invoice Line"
          account_id: "REC: d1_income_account.id"
          uom_quantity: 1
          price_unit: 1000000.0

      - step: "Confirm the full invoice"
        action: "call"
        target: "d1_invoice_full"
        method: "action_confirm"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve the full invoice and post its journal entry"
        action: "call"
        target: "d1_invoice_full"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Create the full deduction document"
        action: "create"
        model: "school_scholarship_deduction"
        save_as: "d1_deduction_full"
        values:
          award_id: "REC: d1_award_full.id"
          date: 2026-08-05
          journal_id: "REC: d1_journal.id"
          receivable_account_id: "REC: d1_receivable_account.id"
          user_id: "REF: base.user_admin"
          line_ids:
            - - 0
              - 0
              - schedule_id: "REC: d1_schedule_full.id"
                funding_id: "REC: d1_funding_full.id"
                final_account_id: "REC: d1_discount_account.id"
                name: "D1 Full Deduction Line"
                uom_quantity: 1
                price_unit: 1000000.0
          allocation_ids:
            - - 0
              - 0
              - customer_invoice_id: "REC: d1_invoice_full.id"
                amount_allocated: 1000000.0

      - step: "Confirm the full deduction as admin"
        action: "call"
        target: "d1_deduction_full"
        method: "action_confirm"
        as_user: "base.user_admin"
        refresh: true

      - step: "Invalidate cache before approving the full deduction"
        action: "call"
        target: "d1_deduction_full"
        method: "invalidate_cache"

      - step: "Approve the full deduction, fully reconciling the invoice"
        action: "call"
        target: "d1_deduction_full"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "open"
          reconciled:
            type: "value"
            expected: true

      - step: "Assert the fully-allocated invoice's residual reached zero"
        action: "assert"
        target: "d1_invoice_full"
        refresh: true
        asserts:
          amount_residual:
            type: "value"
            expected: 0.0

      # ── Positive (compute): amount_total sums two lines; empty
      # condition; amount_unallocated reaches zero once fully
      # allocated ────────────────────────────────────────────────────
      - step: "Create the award backing the two-line deduction"
        action: "create"
        model: "school_scholarship_award"
        save_as: "d1_award_two"
        values:
          program_id: "REC: d1_program.id"
          student_id: "REC: d1_student.id"
          enrollment_id: "REC: d1_enrollment.id"
          date_start: 2026-07-01
          date_end: 2026-12-31
          benefit_ids:
            - - 0
              - 0
              - name: "D1 Two-Line Benefit A"
                product_id: "REC: d1_product.id"
                benefit_type: "cash"
                computation: "fixed"
                amount_fixed: 300000.0
                periodicity: "one_time"
            - - 0
              - 0
              - name: "D1 Two-Line Benefit B"
                product_id: "REC: d1_product.id"
                benefit_type: "cash"
                computation: "fixed"
                amount_fixed: 100000.0
                periodicity: "one_time"
          funding_ids:
            - - 0
              - 0
              - funding_source_id: "REC: d1_funding_source_a.id"
                percentage: 100.0

      - step: "Find the two-line award's first Benefit line"
        action: "search"
        model: "school_scholarship_award_benefit"
        domain:
          [
            ["award_id", "=", "REC: d1_award_two.id"],
            ["name", "=", "D1 Two-Line Benefit A"],
          ]
        limit: 1
        save_as: "d1_benefit_two_a"

      - step: "Find the two-line award's second Benefit line"
        action: "search"
        model: "school_scholarship_award_benefit"
        domain:
          [
            ["award_id", "=", "REC: d1_award_two.id"],
            ["name", "=", "D1 Two-Line Benefit B"],
          ]
        limit: 1
        save_as: "d1_benefit_two_b"

      - step: "Find the two-line award's Funding line"
        action: "search"
        model: "school_scholarship_award_funding"
        domain: [["award_id", "=", "REC: d1_award_two.id"]]
        limit: 1
        save_as: "d1_funding_two"

      - step: "Create the Schedule line for the first Benefit"
        action: "create"
        model: "school_scholarship_award_schedule"
        save_as: "d1_schedule_two_a"
        values:
          benefit_id: "REC: d1_benefit_two_a.id"
          date: 2026-08-01
          state: "scheduled"

      - step: "Create the Schedule line for the second Benefit"
        action: "create"
        model: "school_scholarship_award_schedule"
        save_as: "d1_schedule_two_b"
        values:
          benefit_id: "REC: d1_benefit_two_b.id"
          date: 2026-09-01
          state: "scheduled"

      - step: "Create a deduction with no Lines yet"
        action: "create"
        model: "school_scholarship_deduction"
        save_as: "d1_deduction_empty"
        values:
          award_id: "REC: d1_award_two.id"
          date: 2026-08-05
          journal_id: "REC: d1_journal.id"
          receivable_account_id: "REC: d1_receivable_account.id"

      - step: "Assert Amount Total is zero without any Line"
        action: "assert"
        target: "d1_deduction_empty"
        asserts:
          amount_total:
            type: "value"
            expected: 0.0

      - step: "Create the invoice the two-line deduction is allocated against"
        action: "create"
        model: "customer_invoice"
        save_as: "d1_invoice_two"
        values:
          type_id: "REC: d1_invoice_type.id"
          partner_id: "REC: d1_contact.id"
          date: 2026-08-01
          date_due: 2026-08-15
          currency_id: "REC: company.currency_id.id"
          journal_id: "REC: d1_journal.id"
          receivable_account_id: "REC: d1_receivable_account.id"
          user_id: "REF: base.user_admin"

      - step: "Add a detail line to the two-line deduction's invoice"
