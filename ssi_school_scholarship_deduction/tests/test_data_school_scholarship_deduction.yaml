      - step: "Confirm the two-line deduction's invoice"
        action: "call"
        target: "d1_invoice_two"
        method: "action_confirm"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve the two-line deduction's invoice, giving it a residual"
        action: "call"
        target: "d1_invoice_two"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "open"
          amount_residual:
            type: "value"
            expected: 400000.0

      - step: "Create the two-line deduction document"
        action: "create"
        model: "school_scholarship_deduction"
        save_as: "d1_deduction_two"
        values:
          award_id: "REC: d1_award_two.id"
          date: 2026-08-05
          journal_id: "REC: d1_journal.id"
          receivable_account_id: "REC: d1_receivable_account.id"
          line_ids:
            - - 0
              - 0
              - schedule_id: "REC: d1_schedule_two_a.id"
                funding_id: "REC: d1_funding_two.id"
                final_account_id: "REC: d1_discount_account.id"
                name: "D1 Two-Line Deduction Line A"
                uom_quantity: 1
                price_unit: 300000.0
            - - 0
              - 0
              - schedule_id: "REC: d1_schedule_two_b.id"
                funding_id: "REC: d1_funding_two.id"
                final_account_id: "REC: d1_discount_account.id"
                name: "D1 Two-Line Deduction Line B"
                uom_quantity: 1
                price_unit: 100000.0

      - step: "Assert Amount Total sums both lines"
        action: "assert"
        target: "d1_deduction_two"
        asserts:
          amount_total:
            type: "value"
            expected: 400000.0
          amount_unallocated:
            type: "value"
            expected: 400000.0

      - step: "Fully allocate the two-line deduction against the invoice"
        action: "create"
        model: "school_scholarship_deduction_allocation"
        save_as: "d1_allocation_two"
        values:
          deduction_id: "REC: d1_deduction_two.id"
          customer_invoice_id: "REC: d1_invoice_two.id"
          amount_allocated: 400000.0

      - step: "Assert Amount Unallocated reaches zero once fully allocated"
        action: "assert"
        target: "d1_deduction_two"
        refresh: true
        asserts:
          amount_unallocated:
            type: "value"
            expected: 0.0

      # ── Positive: two-source funding split produces two lines with
      # different Analytic Accounts ──────────────────────────────────
      - step: "Create the award backing the multi-source deduction"
        action: "create"
        model: "school_scholarship_award"
        save_as: "d1_award_multi"
        values:
          program_id: "REC: d1_program.id"
          student_id: "REC: d1_student.id"
          enrollment_id: "REC: d1_enrollment.id"
          date_start: 2026-07-01
          date_end: 2026-12-31
          benefit_ids:
            - - 0
              - 0
              - name: "D1 Multi-Source Benefit"
                product_id: "REC: d1_product.id"
                benefit_type: "cash"
                computation: "fixed"
                amount_fixed: 400000.0
                periodicity: "one_time"
          funding_ids:
            - - 0
              - 0
              - funding_source_id: "REC: d1_funding_source_a.id"
                percentage: 60.0
            - - 0
              - 0
              - funding_source_id: "REC: d1_funding_source_b.id"
                percentage: 40.0

      - step: "Find the multi-source award's Benefit line"
        action: "search"
        model: "school_scholarship_award_benefit"
        domain: [["award_id", "=", "REC: d1_award_multi.id"]]
        limit: 1
        save_as: "d1_benefit_multi"

      - step: "Find the multi-source award's 60% Funding line"
        action: "search"
        model: "school_scholarship_award_funding"
        domain:
          [
            ["award_id", "=", "REC: d1_award_multi.id"],
            ["funding_source_id", "=", "REC: d1_funding_source_a.id"],
          ]
        limit: 1
        save_as: "d1_funding_multi_a"

      - step: "Find the multi-source award's 40% Funding line"
        action: "search"
        model: "school_scholarship_award_funding"
        domain:
          [
            ["award_id", "=", "REC: d1_award_multi.id"],
            ["funding_source_id", "=", "REC: d1_funding_source_b.id"],
          ]
        limit: 1
        save_as: "d1_funding_multi_b"

      - step: "Create the Schedule line realizing the multi-source Benefit"
        action: "create"
        model: "school_scholarship_award_schedule"
        save_as: "d1_schedule_multi"
        values:
          benefit_id: "REC: d1_benefit_multi.id"
          date: 2026-08-01
          state: "scheduled"

      - step: "Create the multi-source deduction with one line per funding source"
        action: "create"
        model: "school_scholarship_deduction"
        save_as: "d1_deduction_multi"
        values:
          award_id: "REC: d1_award_multi.id"
          date: 2026-08-05
          journal_id: "REC: d1_journal.id"
          receivable_account_id: "REC: d1_receivable_account.id"
          line_ids:
            - - 0
              - 0
              - schedule_id: "REC: d1_schedule_multi.id"
                funding_id: "REC: d1_funding_multi_a.id"
                final_account_id: "REC: d1_discount_account.id"
                name: "D1 Multi-Source Deduction Line A"
                uom_quantity: 1
                price_unit: 240000.0
            - - 0
              - 0
              - schedule_id: "REC: d1_schedule_multi.id"
                funding_id: "REC: d1_funding_multi_b.id"
                final_account_id: "REC: d1_discount_account.id"
                name: "D1 Multi-Source Deduction Line B"
                uom_quantity: 1
                price_unit: 160000.0

      - step: "Find the multi-source deduction's line drawing from source A"
        action: "search"
        model: "school_scholarship_deduction_line"
        domain:
          [
            ["deduction_id", "=", "REC: d1_deduction_multi.id"],
            ["funding_id", "=", "REC: d1_funding_multi_a.id"],
          ]
        limit: 1
        save_as: "d1_line_multi_a"

      - step: "Find the multi-source deduction's line drawing from source B"
        action: "search"
        model: "school_scholarship_deduction_line"
        domain:
          [
            ["deduction_id", "=", "REC: d1_deduction_multi.id"],
            ["funding_id", "=", "REC: d1_funding_multi_b.id"],
          ]
        limit: 1
        save_as: "d1_line_multi_b"

      - step: "Assert the source-A line's amount and Analytic Account"
        action: "assert"
        target: "d1_line_multi_a"
        asserts:
          price_subtotal:
            type: "value"
            expected: 240000.0
          analytic_account_id:
            type: "m2o"
            expected: "REC: d1_analytic_a"

      - step: "Assert the source-B line's amount and different Analytic Account"
        action: "assert"
        target: "d1_line_multi_b"
        asserts:
          price_subtotal:
            type: "value"
            expected: 160000.0
          analytic_account_id:
            type: "m2o"
            expected: "REC: d1_analytic_b"

      # ── Onchange (form): selecting Schedule fills Description,
      # Product, and Final Account on a Deduction line; adding
      # Funding then fills Price Unit ──────────────────────────────
      - step: "Open a new Deduction line form and select the Schedule"
        action: "form"
        model: "school_scholarship_deduction_line"
        save: false
        ops:
          - set:
              schedule_id: "REC: d1_schedule_two_a"
          - assert:
              name:
                type: "value"
                expected: "D1 Two-Line Benefit A"
              product_id:
                type: "m2o"
                expected: "REC: d1_product"
              final_account_id:
                type: "value"
                operator: "is_falsy"
          - set:
              funding_id: "REC: d1_funding_two"
          - assert:
              price_unit:
                type: "value"
                expected: 300000.0

      # ── Onchange (form): adding an Allocation line defaults the
      # header's own Receivable Account from that invoice ───────────
      - step: "Open a new Deduction form and add an Allocation"
        action: "form"
        model: "school_scholarship_deduction"
        save: false
        ops:
          - new:
              field: "allocation_ids"
              values:
                customer_invoice_id: "REC: d1_invoice_two"
                amount_allocated: 100000.0
          - assert:
              receivable_account_id:
                type: "m2o"
                expected: "REC: d1_receivable_account"

  - name: "Deduction - Negative Paths"
