      - step: "Create the income account the invoice lines post to"
        action: "create"
        model: "account.account"
        save_as: "d2_income_account"
        values:
          name: "D2 Income Account"
          code: "D2IA"
          user_type_id: "REC: account_type_income.id"
          reconcile: false

      - step: "Create the customer invoice type"
        action: "create"
        model: "customer_invoice_type"
        save_as: "d2_invoice_type"
        values:
          name: "D2 Invoice Type"
          code: "/"
          journal_id: "REC: d2_journal.id"
          receivable_account_id: "REC: d2_receivable_account.id"

      - step: "Create the scholarship type"
        action: "create"
        model: "school_scholarship_type"
        save_as: "d2_type"
        values:
          name: "D2 Type"
          code: "D2TY"
          deduction_journal_id: "REC: d2_journal.id"
          discount_account_id: "REC: d2_discount_account.id"

      - step: "Create the scholarship program"
        action: "create"
        model: "school_scholarship_program"
        save_as: "d2_program"
        values:
          name: "D2 Program"
          code: "D2PRG"
          type_id: "REC: d2_type.id"
          school_id: "REC: d2_school.id"
          academic_year_id: "REC: d2_academic_year.id"
          funding_source_ids: [[6, 0, ["REC: d2_funding_source.id"]]]
          deduction_journal_id: "REC: d2_journal.id"
          discount_account_id: "REC: d2_discount_account.id"
          scope_ids:
            - - 0
              - 0
              - scope_basis: "product"
                product_id: "REC: d2_product.id"
                benefit_type: "cash"
                computation: "fixed"
                percentage: 0.0
                amount_fixed: 100000.0

      - step: "Create the award backing the negative-path fixtures"
        action: "create"
        model: "school_scholarship_award"
        save_as: "d2_award"
        values:
          program_id: "REC: d2_program.id"
          student_id: "REC: d2_student.id"
          enrollment_id: "REC: d2_enrollment.id"
          date_start: 2026-07-01
          date_end: 2026-12-31
          benefit_ids:
            - - 0
              - 0
              - name: "D2 Benefit"
                product_id: "REC: d2_product.id"
                benefit_type: "cash"
                computation: "fixed"
                amount_fixed: 400000.0
                periodicity: "one_time"
          funding_ids:
            - - 0
              - 0
              - funding_source_id: "REC: d2_funding_source.id"
                percentage: 100.0

      - step: "Find the award's Benefit line"
        action: "search"
        model: "school_scholarship_award_benefit"
        domain: [["award_id", "=", "REC: d2_award.id"]]
        limit: 1
        save_as: "d2_benefit"

      - step: "Find the award's Funding line"
        action: "search"
        model: "school_scholarship_award_funding"
        domain: [["award_id", "=", "REC: d2_award.id"]]
        limit: 1
        save_as: "d2_funding"

      - step: "Create the Schedule line realizing the Benefit"
        action: "create"
        model: "school_scholarship_award_schedule"
        save_as: "d2_schedule"
        values:
          benefit_id: "REC: d2_benefit.id"
          date: 2026-08-01
          state: "scheduled"

      - step: "Create an open invoice with a 1000000 residual"
        action: "create"
        model: "customer_invoice"
        save_as: "d2_invoice"
        values:
          type_id: "REC: d2_invoice_type.id"
          partner_id: "REC: d2_contact.id"
          date: 2026-08-01
          date_due: 2026-08-15
          currency_id: "REC: company.currency_id.id"
          journal_id: "REC: d2_journal.id"
          receivable_account_id: "REC: d2_receivable_account.id"
          user_id: "REF: base.user_admin"

      - step: "Add a detail line to the invoice"
        action: "create"
        model: "customer_invoice.line"
        save_as: "d2_invoice_line"
        values:
          customer_invoice_id: "REC: d2_invoice.id"
          name: "D2 Invoice Line"
          account_id: "REC: d2_income_account.id"
          uom_quantity: 1
          price_unit: 1000000.0

      - step: "Confirm the invoice"
        action: "call"
        target: "d2_invoice"
        method: "action_confirm"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve the invoice, opening it with a 1000000 residual"
        action: "call"
        target: "d2_invoice"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "open"
          amount_residual:
            type: "value"
            expected: 1000000.0

      # ── Negative: allocation exceeding the invoice's own residual ──
      - step: "Create a bare deduction to host the over-allocation attempt"
        action: "create"
        model: "school_scholarship_deduction"
        save_as: "d2_deduction_over"
        values:
          award_id: "REC: d2_award.id"
          journal_id: "REC: d2_journal.id"
          receivable_account_id: "REC: d2_receivable_account.id"

      - step: "Reject an allocation exceeding the invoice's residual"
        action: "create"
        model: "school_scholarship_deduction_allocation"
        expect_error:
          type: "ValidationError"
          message_contains: "exceeds"
        values:
          deduction_id: "REC: d2_deduction_over.id"
          customer_invoice_id: "REC: d2_invoice.id"
          amount_allocated: 1200000.0

      # ── Negative: the same invoice allocated twice on one document ─
      - step: "Create a bare deduction to host the duplicate-invoice attempt"
        action: "create"
        model: "school_scholarship_deduction"
        save_as: "d2_deduction_dup"
        values:
          award_id: "REC: d2_award.id"
          journal_id: "REC: d2_journal.id"
          receivable_account_id: "REC: d2_receivable_account.id"
          allocation_ids:
            - - 0
              - 0
              - customer_invoice_id: "REC: d2_invoice.id"
                amount_allocated: 100000.0

      - step: "Reject a second allocation line targeting the same invoice"
        action: "create"
        model: "school_scholarship_deduction_allocation"
        expect_error:
          type: "ValidationError"
          message_contains: "already allocated"
        values:
          deduction_id: "REC: d2_deduction_dup.id"
          customer_invoice_id: "REC: d2_invoice.id"
          amount_allocated: 50000.0

      # ── Negative: Receivable Account does not match the invoice's ──
      - step: "Create an invoice billed on the other receivable account"
        action: "create"
        model: "customer_invoice"
        save_as: "d2_invoice_other"
        values:
          type_id: "REC: d2_invoice_type.id"
          partner_id: "REC: d2_contact.id"
          date: 2026-08-01
          date_due: 2026-08-15
          currency_id: "REC: company.currency_id.id"
          journal_id: "REC: d2_journal.id"
          receivable_account_id: "REC: d2_other_receivable_account.id"
          user_id: "REF: base.user_admin"

      - step: "Add a detail line to the other-account invoice"
        action: "create"
        model: "customer_invoice.line"
        save_as: "d2_invoice_other_line"
        values:
          customer_invoice_id: "REC: d2_invoice_other.id"
          name: "D2 Other Invoice Line"
          account_id: "REC: d2_income_account.id"
          uom_quantity: 1
          price_unit: 400000.0

      - step: "Confirm the other-account invoice"
        action: "call"
        target: "d2_invoice_other"
        method: "action_confirm"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve the other-account invoice"
        action: "call"
        target: "d2_invoice_other"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Create a deduction whose own Receivable Account does not match"
        action: "create"
        model: "school_scholarship_deduction"
        save_as: "d2_deduction_mismatch"
        values:
          award_id: "REC: d2_award.id"
          journal_id: "REC: d2_journal.id"
          # Deliberately the ORIGINAL receivable account, not the
          # invoice's own -- this is the mismatch under test.
          receivable_account_id: "REC: d2_receivable_account.id"
          user_id: "REF: base.user_admin"
          line_ids:
            - - 0
              - 0
              - schedule_id: "REC: d2_schedule.id"
                funding_id: "REC: d2_funding.id"
                final_account_id: "REC: d2_discount_account.id"
                name: "D2 Mismatch Deduction Line"
                uom_quantity: 1
                price_unit: 400000.0
          allocation_ids:
            - - 0
              - 0
              - customer_invoice_id: "REC: d2_invoice_other.id"
                amount_allocated: 400000.0

      - step: "Confirm the mismatched-account deduction"
        action: "call"
        target: "d2_deduction_mismatch"
        method: "action_confirm"
        as_user: "base.user_admin"
        refresh: true

      - step: "Invalidate cache before approving the mismatched deduction"
        action: "call"
        target: "d2_deduction_mismatch"
        method: "invalidate_cache"

      - step: "Approving is rejected by the Receivable Account mismatch"
        action: "call"
        target: "d2_deduction_mismatch"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        expect_error:
          type: "UserError"
          message_contains: "Receivable Account"

      # ── Negative: opening with a nonzero Amount Unallocated ────────
      - step: "Create a deduction whose Amount Total is not fully allocated"
        action: "create"
        model: "school_scholarship_deduction"
        save_as: "d2_deduction_unallocated"
        values:
          award_id: "REC: d2_award.id"
          journal_id: "REC: d2_journal.id"
          receivable_account_id: "REC: d2_receivable_account.id"
          user_id: "REF: base.user_admin"
          line_ids:
            - - 0
              - 0
              - schedule_id: "REC: d2_schedule.id"
                funding_id: "REC: d2_funding.id"
                final_account_id: "REC: d2_discount_account.id"
                name: "D2 Unallocated Deduction Line"
                uom_quantity: 1
                price_unit: 400000.0
          allocation_ids:
            - - 0
              - 0
              - customer_invoice_id: "REC: d2_invoice.id"
                amount_allocated: 300000.0

      - step: "Confirm the under-allocated deduction"
        action: "call"
        target: "d2_deduction_unallocated"
        method: "action_confirm"
        as_user: "base.user_admin"
        refresh: true

      - step: "Invalidate cache before approving the under-allocated deduction"
        action: "call"
        target: "d2_deduction_unallocated"
        method: "invalidate_cache"

      - step: "Approving is rejected by the nonzero Amount Unallocated"
        action: "call"
        target: "d2_deduction_unallocated"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        expect_error:
          type: "UserError"
          message_contains: "Amount Unallocated"
