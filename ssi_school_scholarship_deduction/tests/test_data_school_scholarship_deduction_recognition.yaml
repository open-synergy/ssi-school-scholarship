        save_as: "r2_award"
        values:
          program_id: "REC: r2_program.id"
          student_id: "REC: r2_student.id"
          enrollment_id: "REC: r2_enrollment.id"
          date_start: 2026-07-01
          date_end: 2026-12-31
          deferred_discount_account_id: "REC: r2_deferred_account.id"
          recognition_journal_id: "REC: r2_journal.id"
          benefit_ids:
            - - 0
              - 0
              - name: "R2 Benefit"
                product_id: "REC: r2_product.id"
                benefit_type: "cash"
                computation: "fixed"
                amount_fixed: 400000.0
                periodicity: "one_time"
          funding_ids:
            - - 0
              - 0
              - funding_source_id: "REC: r2_funding_source.id"
                percentage: 100.0

      - step: "Find the guard chain award's Benefit line"
        action: "search"
        model: "school_scholarship_award_benefit"
        domain: [["award_id", "=", "REC: r2_award.id"]]
        limit: 1
        save_as: "r2_benefit"

      - step: "Find the guard chain award's Funding line"
        action: "search"
        model: "school_scholarship_award_funding"
        domain: [["award_id", "=", "REC: r2_award.id"]]
        limit: 1
        save_as: "r2_funding"

      - step: "Create the Schedule line realizing the guard chain Benefit"
        action: "create"
        model: "school_scholarship_award_schedule"
        save_as: "r2_schedule"
        values:
          benefit_id: "REC: r2_benefit.id"
          date: 2026-08-01
          state: "scheduled"

      - step: "Create an open invoice that credits an Income account"
        action: "create"
        model: "customer_invoice"
        save_as: "r2_invoice"
        values:
          type_id: "REC: r2_invoice_type.id"
          partner_id: "REC: r2_contact.id"
          date: 2026-03-01
          date_due: 2026-03-15
          currency_id: "REC: company.currency_id.id"
          journal_id: "REC: r2_journal.id"
          receivable_account_id: "REC: r2_receivable_account.id"
          user_id: "REF: base.user_admin"

      - step: "Add a detail line to the invoice, crediting the Income account"
        action: "create"
        model: "customer_invoice.line"
        save_as: "r2_invoice_line"
        values:
          customer_invoice_id: "REC: r2_invoice.id"
          name: "R2 Invoice Line"
          account_id: "REC: r2_income_account.id"
          uom_quantity: 1
          price_unit: 400000.0

      - step: "Confirm the invoice"
        action: "call"
        target: "r2_invoice"
        method: "action_confirm"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve the invoice"
        action: "call"
        target: "r2_invoice"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Reject a deferred deduction with no Deferred Account"
        action: "create"
        model: "school_scholarship_deduction"
        expect_error:
          type: "ValidationError"
          message_contains: "Deferred Account"
        values:
          award_id: "REC: r2_award.id"
          date: 2026-03-01
          journal_id: "REC: r2_journal.id"
          receivable_account_id: "REC: r2_receivable_account.id"
          recognition_journal_id: "REC: r2_journal.id"
          user_id: "REF: base.user_admin"
          line_ids:
            - - 0
              - 0
              - schedule_id: "REC: r2_schedule.id"
                funding_id: "REC: r2_funding.id"
                final_account_id: "REC: r2_discount_account.id"
                name: "R2 No Deferred Account Line"
                uom_quantity: 1
                price_unit: 400000.0

      - step:
          "A deferred deduction with no allocation saves even while asymmetry is
          disallowed"
        action: "create"
        model: "school_scholarship_deduction"
        save_as: "r2_deduction_unallocated"
        values:
          award_id: "REC: r2_award.id"
          date: 2026-03-01
          journal_id: "REC: r2_journal.id"
          receivable_account_id: "REC: r2_receivable_account.id"
          deferred_account_id: "REC: r2_deferred_account.id"
          recognition_journal_id: "REC: r2_journal.id"
          user_id: "REF: base.user_admin"
          line_ids:
            - - 0
              - 0
              - schedule_id: "REC: r2_schedule.id"
                funding_id: "REC: r2_funding.id"
                final_account_id: "REC: r2_discount_account.id"
                name: "R2 Unallocated Deferred Line"
                uom_quantity: 1
                price_unit: 400000.0

      - step:
          "Assert the unallocated deferred deduction saved without tripping the guard"
        action: "assert"
        target: "r2_deduction_unallocated"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          recognition_method:
            type: "value"
            expected: "deferred"

      - step: "Reject deferring the deduction while the invoice still credits Income"
        action: "create"
        model: "school_scholarship_deduction"
        expect_error:
          type: "ValidationError"
          message_contains: "immediately"
        values:
          award_id: "REC: r2_award.id"
          date: 2026-03-01
          journal_id: "REC: r2_journal.id"
          receivable_account_id: "REC: r2_receivable_account.id"
          deferred_account_id: "REC: r2_deferred_account.id"
          recognition_journal_id: "REC: r2_journal.id"
          user_id: "REF: base.user_admin"
          line_ids:
            - - 0
              - 0
              - schedule_id: "REC: r2_schedule.id"
                funding_id: "REC: r2_funding.id"
                final_account_id: "REC: r2_discount_account.id"
                name: "R2 Deduction Line"
                uom_quantity: 1
                price_unit: 400000.0
          allocation_ids:
            - - 0
              - 0
              - customer_invoice_id: "REC: r2_invoice.id"
                amount_allocated: 400000.0

      - step: "Enable Allow Asymmetric Recognition on the Program"
        action: "write"
        target: "r2_program"
        values:
          allow_asymmetric_recognition: true

      - step: "The same deduction is now accepted with the asymmetry allowed"
        action: "create"
        model: "school_scholarship_deduction"
        save_as: "r2_deduction_ok"
        values:
          award_id: "REC: r2_award.id"
          date: 2026-03-01
          journal_id: "REC: r2_journal.id"
          receivable_account_id: "REC: r2_receivable_account.id"
          deferred_account_id: "REC: r2_deferred_account.id"
          recognition_journal_id: "REC: r2_journal.id"
          user_id: "REF: base.user_admin"
          line_ids:
            - - 0
              - 0
              - schedule_id: "REC: r2_schedule.id"
                funding_id: "REC: r2_funding.id"
                final_account_id: "REC: r2_discount_account.id"
                name: "R2 Deduction Line"
                uom_quantity: 1
                price_unit: 400000.0
          allocation_ids:
            - - 0
              - 0
              - customer_invoice_id: "REC: r2_invoice.id"
                amount_allocated: 400000.0

      - step: "Assert the asymmetric deduction saved as Deferred"
        action: "assert"
        target: "r2_deduction_ok"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          recognition_method:
            type: "value"
            expected: "deferred"
