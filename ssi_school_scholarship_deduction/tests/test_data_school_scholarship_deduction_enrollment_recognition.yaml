options:
  auto_refresh: true
scenarios:
  - name:
      "Enrollment Mode: Set On Open, Recognized On Done, Excluded From Wizard, Cancel
      Rejected After Recognition"
    steps:
      - step: "Get the account.account.type Income reference"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "ea_income_type"

      - step: "Get the account.account.type Receivable reference"
        action: "ref"
        xml_id: "account.data_account_type_receivable"
        save_as: "ea_receivable_type"

      - step: "Get the account.account.type Current Assets reference"
        action: "ref"
        xml_id: "account.data_account_type_current_assets"
        save_as: "ea_asset_type"

      - step: "Create the sale journal"
        action: "create"
        model: "account.journal"
        save_as: "ea_journal"
        values:
          name: "EA Journal"
          code: "JEA"
          type: "sale"

      - step: "Create the receivable account shared by the invoice and deduction"
        action: "create"
        model: "account.account"
        save_as: "ea_receivable_account"
        values:
          name: "EA Receivable Account"
          code: "EARA"
          user_type_id: "REC: ea_receivable_type.id"
          reconcile: true

      - step: "Create the enrollment's own deferred (temp) income account"
        action: "create"
        model: "account.account"
        save_as: "ea_enroll_deferred_account"
        values:
          name: "EA Enrollment Deferred Account"
          code: "EAED"
          user_type_id: "REC: ea_income_type.id"

      - step: "Create the enrollment's own final income account"
        action: "create"
        model: "account.account"
        save_as: "ea_enroll_final_account"
        values:
          name: "EA Enrollment Final Account"
          code: "EAEF"
          user_type_id: "REC: ea_income_type.id"

      - step: "Create the scholarship discount's own final account"
        action: "create"
        model: "account.account"
        save_as: "ea_discount_final_account"
        values:
          name: "EA Discount Final Account"
          code: "EADF"
          user_type_id: "REC: ea_income_type.id"

      - step: "Create the award's own Deferred Discount (temp/holding) account"
        action: "create"
        model: "account.account"
        save_as: "ea_deferred_account"
        values:
          name: "EA Deferred Discount Account"
          code: "EADD"
          user_type_id: "REC: ea_asset_type.id"

      - step: "Create the customer invoice type"
        action: "create"
        model: "customer_invoice_type"
        save_as: "ea_ci_type"
        values:
          name: "EA Invoice Type"
          code: "CITEA"
          journal_id: "REC: ea_journal.id"
          receivable_account_id: "REC: ea_receivable_account.id"

      - step: "Create the product covered by the enrollment and the benefit"
        action: "create"
        model: "product.product"
        save_as: "ea_product"
        values:
          name: "EA Product"
          type: "service"
          list_price: 1000000.0

      - step: "Create the grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "ea_grade_type"
        values:
          name: "EA Grade Type"
          code: "EAGT"
          sequence: 10

      - step: "Create the academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "ea_academic_year"
        values:
          name: "2026/2027 EA"
          code: "EAAY"
          date_start: 2026-07-01
          date_end: 2027-06-30

      - step: "Create academic term 1 (enrollment's own term, not last)"
        action: "create"
        model: "school_academic_term"
        save_as: "ea_academic_term"
        values:
          name: "Semester 1 EA"
          code: "EASM1"
          date_start: 2026-07-01
          date_end: 2026-12-31
          year_id: "REC: ea_academic_year.id"
          enrollment_state: "open"

      - step: "Create academic term 2 (last term, unused)"
        action: "create"
        model: "school_academic_term"
        save_as: "ea_academic_term_2"
        values:
          name: "Semester 2 EA"
          code: "EASM2"
          date_start: 2027-01-01
          date_end: 2027-06-30
          year_id: "REC: ea_academic_year.id"
          enrollment_state: "close"

      - step: "Create the school"
        action: "create"
        model: "school"
        save_as: "ea_school"
        values:
          name: "EA School"
          code: "EASC"
          grade_type_id: "REC: ea_grade_type.id"

      - step: "Create the grade"
        action: "create"
        model: "school_grade"
        save_as: "ea_grade"
        values:
          name: "EA Grade"
          code: "EAGR"
          sequence: 10
          type_id: "REC: ea_grade_type.id"

      - step: "Create the grade class"
        action: "create"
        model: "school_grade_class"
        save_as: "ea_grade_class"
        values:
          name: "EA Class"
          code: "EACL"
          school_id: "REC: ea_school.id"
          grade_id: "REC: ea_grade.id"

      - step: "Create the student contact"
        action: "create"
        model: "res.partner"
        save_as: "ea_contact"
        values:
          name: "EA Student Contact"

      - step: "Create the student"
        action: "create"
        model: "school_student"
        save_as: "ea_student"
        values:
          name: "EA Student"
          code: "EAST"
          contact_id: "REC: ea_contact.id"
          school_id: "REC: ea_school.id"

      - step: "Create the enrollment with Revenue Recognition enabled"
        action: "create"
        model: "school_enrollment"
        save_as: "ea_enrollment"
        values:
          date: 2026-07-01
          academic_year_id: "REC: ea_academic_year.id"
          academic_term_id: "REC: ea_academic_term.id"
          school_id: "REC: ea_school.id"
          grade_id: "REC: ea_grade.id"
          grade_class_id: "REC: ea_grade_class.id"
          student_id: "REC: ea_student.id"
          currency_id: "REC: company.currency_id.id"
          receivable_journal_id: "REC: ea_journal.id"
          receivable_account_id: "REC: ea_receivable_account.id"
          customer_invoice_type_id: "REC: ea_ci_type.id"
          revenue_recognition: true
          recognition_journal_id: "REC: ea_journal.id"

      - step: "Confirm the enrollment"
        action: "call"
        target: "ea_enrollment"
        method: "action_confirm"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve the enrollment"
        action: "call"
        target: "ea_enrollment"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Create the payment term to be invoiced"
        action: "create"
        model: "school_enrollment_payment_term"
        save_as: "ea_term"
        values:
          enrollment_id: "REC: ea_enrollment.id"
          name: "Term EA"
          sequence: 10
          date_invoice: 2026-07-05
          date_due: 2026-07-20

      - step: "Create the term detail"
        action: "create"
        model: "school_enrollment_payment_term_detail"
        save_as: "ea_detail"
        values:
          term_id: "REC: ea_term.id"
          product_id: "REC: ea_product.id"
          name: "Fee EA"
          account_id: "REC: ea_enroll_deferred_account.id"
          final_account_id: "REC: ea_enroll_final_account.id"
          uom_quantity: 1.0
          uom_id: "REF: uom.product_uom_unit"
          price_unit: 1000000.0

      - step: "Invoice the term"
        action: "call"
        target: "ea_term"
        method: "action_create_invoice"
        as_user: "base.user_admin"

      - step: "Get the term's generated invoice"
        action: "search"
        model: "customer_invoice"
        domain: [["id", "=", "REC: ea_term.customer_invoice_id.id"]]
        save_as: "ea_invoice"
        expect_count: 1

      - step: "Confirm the invoice"
        action: "call"
        target: "ea_invoice"
        method: "action_confirm"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Open the invoice"
        action: "call"
        target: "ea_invoice"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Create the analytic account for the funding source"
        action: "create"
        model: "account.analytic.account"
        save_as: "ea_analytic"
        values:
          name: "EA Analytic"

      - step: "Create the funding source"
        action: "create"
        model: "school_scholarship_funding_source"
        save_as: "ea_funding_source"
        values:
          name: "EA Funding Source"
          code: "EAFS"
          analytic_account_id: "REC: ea_analytic.id"

      - step: "Create the scholarship type"
        action: "create"
        model: "school_scholarship_type"
        save_as: "ea_type"
        values:
          name: "EA Type"
          code: "EATY"
          deduction_journal_id: "REC: ea_journal.id"
          discount_account_id: "REC: ea_discount_final_account.id"

      - step: "Create the scholarship program"
        action: "create"
        model: "school_scholarship_program"
        save_as: "ea_program"
        values:
          name: "EA Program"
          code: "EAPRG"
          type_id: "REC: ea_type.id"
          school_id: "REC: ea_school.id"
          academic_year_id: "REC: ea_academic_year.id"
          funding_source_ids: [[6, 0, ["REC: ea_funding_source.id"]]]
          deduction_journal_id: "REC: ea_journal.id"
          discount_account_id: "REC: ea_discount_final_account.id"
          scope_ids:
            - - 0
              - 0
              - scope_basis: "product"
                product_id: "REC: ea_product.id"
                benefit_type: "cash"
                computation: "fixed"
                percentage: 0.0
                amount_fixed: 400000.0

      - step: "Create the award, its Deferred Discount Account already set"
        action: "create"
        model: "school_scholarship_award"
        save_as: "ea_award"
        values:
          program_id: "REC: ea_program.id"
          student_id: "REC: ea_student.id"
          enrollment_id: "REC: ea_enrollment.id"
          date_start: 2026-07-01
          date_end: 2026-12-31
          deferred_discount_account_id: "REC: ea_deferred_account.id"
          recognition_journal_id: "REC: ea_journal.id"
          benefit_ids:
            - - 0
              - 0
              - name: "EA Benefit"
                product_id: "REC: ea_product.id"
                benefit_type: "cash"
                computation: "fixed"
                amount_fixed: 400000.0
                periodicity: "one_time"
          funding_ids:
            - - 0
              - 0
              - funding_source_id: "REC: ea_funding_source.id"
                percentage: 100.0

      - step: "Find the award's Benefit line"
        action: "search"
        model: "school_scholarship_award_benefit"
        domain: [["award_id", "=", "REC: ea_award.id"]]
        limit: 1
        save_as: "ea_benefit"

      - step: "Find the award's Funding line"
        action: "search"
        model: "school_scholarship_award_funding"
        domain: [["award_id", "=", "REC: ea_award.id"]]
        limit: 1
        save_as: "ea_funding"

      - step: "Create the Schedule line realizing the Benefit"
        action: "create"
        model: "school_scholarship_award_schedule"
        save_as: "ea_schedule"
        values:
          benefit_id: "REC: ea_benefit.id"
          date: 2026-08-01
          state: "scheduled"

      - step:
          "Create the deduction, Date on/after the Award's Start Date (would default to
          immediate)"
        action: "create"
        model: "school_scholarship_deduction"
        save_as: "ea_deduction"
        values:
          award_id: "REC: ea_award.id"
          date: 2026-08-05
          journal_id: "REC: ea_journal.id"
          receivable_account_id: "REC: ea_receivable_account.id"
          deferred_account_id: "REC: ea_deferred_account.id"
          recognition_journal_id: "REC: ea_journal.id"
          user_id: "REF: base.user_admin"
          line_ids:
            - - 0
              - 0
              - schedule_id: "REC: ea_schedule.id"
                funding_id: "REC: ea_funding.id"
                final_account_id: "REC: ea_discount_final_account.id"
                name: "EA Deduction Line"
                uom_quantity: 1
                price_unit: 400000.0
          allocation_ids:
            - - 0
              - 0
              - customer_invoice_id: "REC: ea_invoice.id"
                amount_allocated: 400000.0

      - step: "Confirm the deduction"
        action: "call"
        target: "ea_deduction"
        method: "action_confirm"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve the deduction, opening it"
        action: "call"
        target: "ea_deduction"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "open"
          recognition_method:
            type: "value"
            expected: "enrollment"
          recognition_state:
            type: "value"
            expected: "not_applicable"

      - step: "Get the deduction's own Line"
        action: "search"
        model: "school_scholarship_deduction_line"
        domain: [["deduction_id", "=", "REC: ea_deduction.id"]]
        save_as: "ea_line"
        expect_count: 1

      - step: "Assert the Line posts to the Deferred Discount (temp) account"
        action: "assert"
        target: "ea_line"
        asserts:
          account_id.id:
            type: "value"
            expected: "REC: ea_deferred_account.id"

      - step:
          "Assert the enrollment-mode deduction is excluded from the recognition
          wizard's own due domain"
        action: "search"
        model: "school_scholarship_deduction"
        domain:
          - ["id", "=", "REC: ea_deduction.id"]
          - ["recognition_state", "=", "pending"]
        save_as: "ea_wizard_candidates"
        expect_count: 0

      - step: "Assert the enrollment's own term is not the last term (done is allowed)"
        action: "assert"
        target: "ea_enrollment"
        asserts:
          academic_term_id.last_term:
            type: "value"
            expected: false

      - step: "Finish the enrollment"
        action: "call"
        target: "ea_enrollment"
        method: "action_done"
        as_user: "base.user_admin"

      - step: "Assert the Revenue Recognition move was posted"
        action: "assert"
        target: "ea_enrollment"
        asserts:
          state:
            type: "value"
            expected: "done"
          recognition_move_id:
            type: "value"
            operator: "is_truthy"
          recognition_move_id.state:
            type: "value"
            expected: "posted"

      - step: "Find the Recognition Line generated for the deduction's own Line"
        action: "search"
        model: "school_enrollment_revenue_recognition_line"
        domain: [["scholarship_deduction_line_id", "=", "REC: ea_line.id"]]
        save_as: "ea_recognition_line"
        expect_count: 1

      - step: "Assert the Recognition Line's own accounts and amount"
        action: "assert"
        target: "ea_recognition_line"
        asserts:
          enrollment_id.id:
            type: "value"
            expected: "REC: ea_enrollment.id"
          debit_account_id.id:
            type: "value"
            expected: "REC: ea_deferred_account.id"
          credit_account_id.id:
            type: "value"
            expected: "REC: ea_discount_final_account.id"
          amount:
            type: "value"
            expected: -400000.0

      - step: "Find the journal item posted on the Discount Final Account"
        action: "search"
        model: "account.move.line"
        domain:
          - ["move_id", "=", "REC: ea_enrollment.recognition_move_id.id"]
          - ["account_id", "=", "REC: ea_discount_final_account.id"]
        save_as: "ea_final_ml"
        expect_count: 1

      - step: "Assert the Discount Final Account was debited"
        action: "assert"
        target: "ea_final_ml"
        asserts:
          debit:
            type: "value"
            expected: 400000.0
          credit:
            type: "value"
            expected: 0.0

      - step: "Find the journal item posted on the Deferred Discount Account"
        action: "search"
        model: "account.move.line"
        domain:
          - ["move_id", "=", "REC: ea_enrollment.recognition_move_id.id"]
          - ["account_id", "=", "REC: ea_deferred_account.id"]
        save_as: "ea_deferred_ml"
        expect_count: 1

      - step: "Assert the Deferred Discount Account was credited back"
        action: "assert"
        target: "ea_deferred_ml"
        asserts:
          debit:
            type: "value"
            expected: 0.0
          credit:
            type: "value"
            expected: 400000.0

      - step: "Create the cancellation reason"
        action: "create"
        model: "base.cancel_reason"
        save_as: "ea_reason"
        values:
          name: "EA Cancel Reason"
          code: "EACR"

      - step:
          "Attempt to cancel the deduction now that its Line is referenced by the
          enrollment's own Revenue Recognition"
        action: "wizard"
        model: "base.select_cancel_reason"
        target: "ea_deduction"
        as_user: "base.user_admin"
        values:
          cancel_reason_id: "REC: ea_reason.id"
        method: "action_confirm"
        expect_error:
          type: "UserError"
          message_contains: "Revenue Recognition"

  - name: "Revenue Recognition Disabled Leaves The Deduction Immediate"
    steps:
      - step: "Get the account.account.type Income reference"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "eb_income_type"

      - step: "Get the account.account.type Receivable reference"
        action: "ref"
        xml_id: "account.data_account_type_receivable"
        save_as: "eb_receivable_type"

      - step: "Get the account.account.type Current Assets reference"
        action: "ref"
        xml_id: "account.data_account_type_current_assets"
        save_as: "eb_asset_type"

      - step: "Create the sale journal"
        action: "create"
        model: "account.journal"
        save_as: "eb_journal"
        values:
          name: "EB Journal"
          code: "JEB"
          type: "sale"

      - step: "Create the receivable account shared by the invoice and deduction"
        action: "create"
        model: "account.account"
        save_as: "eb_receivable_account"
        values:
          name: "EB Receivable Account"
          code: "EBRA"
          user_type_id: "REC: eb_receivable_type.id"
          reconcile: true

      - step: "Create the enrollment's own deferred (temp) income account"
        action: "create"
        model: "account.account"
        save_as: "eb_enroll_deferred_account"
        values:
          name: "EB Enrollment Deferred Account"
          code: "EBED"
          user_type_id: "REC: eb_income_type.id"

      - step: "Create the enrollment's own final income account"
        action: "create"
        model: "account.account"
        save_as: "eb_enroll_final_account"
        values:
          name: "EB Enrollment Final Account"
          code: "EBEF"
          user_type_id: "REC: eb_income_type.id"

      - step: "Create the scholarship discount's own final account"
        action: "create"
        model: "account.account"
        save_as: "eb_discount_final_account"
        values:
          name: "EB Discount Final Account"
          code: "EBDF"
          user_type_id: "REC: eb_income_type.id"

      - step: "Create the award's own Deferred Discount (temp/holding) account"
        action: "create"
        model: "account.account"
        save_as: "eb_deferred_account"
        values:
          name: "EB Deferred Discount Account"
          code: "EBDD"
          user_type_id: "REC: eb_asset_type.id"

      - step: "Create the customer invoice type"
        action: "create"
        model: "customer_invoice_type"
        save_as: "eb_ci_type"
        values:
          name: "EB Invoice Type"
          code: "CITEB"
          journal_id: "REC: eb_journal.id"
          receivable_account_id: "REC: eb_receivable_account.id"

      - step: "Create the product"
        action: "create"
        model: "product.product"
        save_as: "eb_product"
        values:
          name: "EB Product"
          type: "service"
          list_price: 1000000.0

      - step: "Create the grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "eb_grade_type"
        values:
          name: "EB Grade Type"
          code: "EBGT"
          sequence: 10

      - step: "Create the academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "eb_academic_year"
        values:
          name: "2026/2027 EB"
          code: "EBAY"
          date_start: 2026-07-01
          date_end: 2027-06-30

      - step: "Create the academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "eb_academic_term"
        values:
          name: "Semester EB"
          code: "EBSM"
          date_start: 2026-07-01
          date_end: 2027-06-30
          year_id: "REC: eb_academic_year.id"
          enrollment_state: "open"

      - step: "Create the school"
        action: "create"
        model: "school"
        save_as: "eb_school"
        values:
          name: "EB School"
          code: "EBSC"
          grade_type_id: "REC: eb_grade_type.id"

      - step: "Create the grade"
        action: "create"
        model: "school_grade"
        save_as: "eb_grade"
        values:
          name: "EB Grade"
          code: "EBGR"
          sequence: 10
          type_id: "REC: eb_grade_type.id"

      - step: "Create the grade class"
        action: "create"
        model: "school_grade_class"
        save_as: "eb_grade_class"
        values:
          name: "EB Class"
          code: "EBCL"
          school_id: "REC: eb_school.id"
          grade_id: "REC: eb_grade.id"

      - step: "Create the student contact"
        action: "create"
        model: "res.partner"
        save_as: "eb_contact"
        values:
          name: "EB Student Contact"

      - step: "Create the student"
        action: "create"
        model: "school_student"
        save_as: "eb_student"
        values:
          name: "EB Student"
          code: "EBST"
          contact_id: "REC: eb_contact.id"
          school_id: "REC: eb_school.id"

      - step: "Create the enrollment with Revenue Recognition left disabled"
        action: "create"
        model: "school_enrollment"
        save_as: "eb_enrollment"
        values:
          date: 2026-07-01
          academic_year_id: "REC: eb_academic_year.id"
          academic_term_id: "REC: eb_academic_term.id"
          school_id: "REC: eb_school.id"
          grade_id: "REC: eb_grade.id"
