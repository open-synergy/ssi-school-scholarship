options:
  auto_refresh: true
scenarios:
  - name: "Admission Guards - Draft Award, Payment Term Deletion And Cancel"
    steps:
      # ── Shared fixture chain (suffix AG1) ────────────────────────
      - step: "Create the grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "ag1_grade_type"
        values:
          name: "AG1 Grade Type"
          code: "AG1GT"

      - step: "Create the school"
        action: "create"
        model: "school"
        save_as: "ag1_school"
        values:
          name: "AG1 School"
          code: "AG1SC"
          grade_type_id: "REC: ag1_grade_type.id"

      - step: "Create the academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "ag1_academic_year"
        values:
          name: "AG1 Academic Year"
          code: "AG1AY"
          date_start: 2026-07-01
          date_end: 2027-06-30

      - step: "Create the academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "ag1_academic_term"
        values:
          name: "AG1 Term"
          code: "AG1TM"
          date_start: 2026-07-01
          date_end: 2026-12-31
          year_id: "REC: ag1_academic_year.id"

      - step: "Create the grade"
        action: "create"
        model: "school_grade"
        save_as: "ag1_grade"
        values:
          name: "AG1 Grade"
          code: "AG1GR"
          type_id: "REC: ag1_grade_type.id"

      - step: "Create the admission student's contact"
        action: "create"
        model: "res.partner"
        save_as: "ag1_contact"
        values:
          name: "AG1 Admission Contact"

      - step: "Create the admission, left in Draft"
        action: "create"
        model: "school_admission"
        save_as: "ag1_admission"
        values:
          academic_year_id: "REC: ag1_academic_year.id"
          academic_term_id: "REC: ag1_academic_term.id"
          school_id: "REC: ag1_school.id"
          grade_id: "REC: ag1_grade.id"
          student_id: "REC: ag1_contact.id"
          user_id: "REF: base.user_admin"

      - step: "Create the student profile while the admission is Draft"
        action: "call"
        target: "ag1_admission"
        method: "action_create_school_student"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "draft"
          school_student_id:
            type: "value"
            operator: "is_truthy"

      - step: "Create the analytic account for the funding source"
        action: "create"
        model: "account.analytic.account"
        save_as: "ag1_analytic"
        values:
          name: "AG1 Analytic"

      - step: "Create the funding source"
        action: "create"
        model: "school_scholarship_funding_source"
        save_as: "ag1_funding_source"
        values:
          name: "AG1 Funding Source"
          code: "AG1FS"
          analytic_account_id: "REC: ag1_analytic.id"

      - step: "Create the product covered by the benefit line"
        action: "create"
        model: "product.product"
        save_as: "ag1_product"
        values:
          name: "AG1 Product"
          type: "service"

      - step: "Create the sale journal used by the scholarship type"
        action: "create"
        model: "account.journal"
        save_as: "ag1_journal"
        values:
          name: "AG1 Journal"
          code: "JAG1"
          type: "sale"

      - step: "Get the account.account.type Income reference"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "account_type_income"

      - step: "Create the discount account"
        action: "create"
        model: "account.account"
        save_as: "ag1_discount_account"
        values:
          name: "AG1 Discount Account"
          code: "AG1DA"
          user_type_id: "REC: account_type_income.id"
          reconcile: false

      - step: "Create the income account used by the payment term detail"
        action: "create"
        model: "account.account"
        save_as: "ag1_income_account"
        values:
          name: "AG1 Income Account"
          code: "AG1IA"
          user_type_id: "REC: account_type_income.id"
          reconcile: false

      - step: "Create the scholarship type"
        action: "create"
        model: "school_scholarship_type"
        save_as: "ag1_type"
        values:
          name: "AG1 Type"
          code: "AG1TY"
          deduction_journal_id: "REC: ag1_journal.id"
          discount_account_id: "REC: ag1_discount_account.id"

      - step: "Create the scholarship program"
        action: "create"
        model: "school_scholarship_program"
        save_as: "ag1_program"
        values:
          name: "AG1 Program"
          code: "AG1PRG"
          type_id: "REC: ag1_type.id"
          school_id: "REC: ag1_school.id"
          academic_year_id: "REC: ag1_academic_year.id"
          funding_source_ids: [[6, 0, ["REC: ag1_funding_source.id"]]]
          deduction_journal_id: "REC: ag1_journal.id"
          discount_account_id: "REC: ag1_discount_account.id"
          scope_ids:
            - - 0
              - 0
              - scope_basis: "product"
                product_id: "REC: ag1_product.id"
                benefit_type: "fee_reduction"
                computation: "percentage"
                percentage: 40.0

      - step: "Get the sale journal for the payment template"
        action: "search"
        model: "account.journal"
        domain: [["type", "=", "sale"]]
        save_as: "ag1_sale_journal"
        limit: 1

      - step: "Get the receivable account type"
        action: "ref"
        xml_id: "account.data_account_type_receivable"
        save_as: "ag1_receivable_type"

      - step: "Create the receivable account"
        action: "create"
        model: "account.account"
        save_as: "ag1_receivable_account"
        values:
          name: "AG1 Receivable Account"
          code: "AG1RA"
          user_type_id: "REC: ag1_receivable_type.id"
          reconcile: true

      - step: "Create the customer invoice type"
        action: "create"
        model: "customer_invoice_type"
        save_as: "ag1_ci_type"
        values:
          name: "AG1 Customer Invoice Type"
          code: "AG1CIT"
          journal_id: "REC: ag1_sale_journal.id"
          receivable_account_id: "REC: ag1_receivable_account.id"

      - step: "Create an empty payment template"
        action: "create"
        model: "school_admission_payment_template"
        save_as: "ag1_template"
        values:
          name: "AG1 Payment Template"
          code: "AG1PT"
          school_id: "REC: ag1_school.id"
          grade_id: "REC: ag1_grade.id"
          academic_term_id: "REC: ag1_academic_term.id"
          receivable_journal_id: "REC: ag1_sale_journal.id"
          receivable_account_id: "REC: ag1_receivable_account.id"
          customer_invoice_type_id: "REC: ag1_ci_type.id"

      - step: "Attach the payment template to the admission"
        action: "write"
        target: "ag1_admission"
        values:
          payment_template_id: "REC: ag1_template.id"

      - step: "Create the cancellation reason"
        action: "create"
        model: "base.cancel_reason"
        save_as: "ag1_cancel_reason"
        values:
          name: "AG1 Cancel Reason"
          code: "AG1CR"

      - step: "Create the Admission Payment Term"
        action: "create"
        model: "school_admission_payment_term"
        save_as: "ag1_term1"
        values:
          admission_id: "REC: ag1_admission.id"
          name: "AG1 Term"
          date_invoice: 2026-08-01
          detail_ids:
            - - 0
              - 0
              - product_id: "REC: ag1_product.id"
                name: "AG1 Term Fee"
                account_id: "REC: ag1_income_account.id"
                uom_quantity: 1.0
                uom_id: "REF: uom.product_uom_unit"
                price_unit: 1000000.0

      - step: "Create the award on the Draft admission"
        action: "create"
        model: "school_scholarship_award"
        save_as: "ag1_award"
        values:
          program_id: "REC: ag1_program.id"
          source_type: "admission"
          admission_id: "REC: ag1_admission.id"
          student_id: "REC: ag1_admission.school_student_id.id"
          date_start: 2026-07-01
          date_end: 2026-12-31
          discount_account_id: "REC: ag1_discount_account.id"
          user_id: "REF: base.user_admin"
          benefit_ids:
            - - 0
              - 0
              - name: "AG1 Benefit"
                product_id: "REC: ag1_product.id"
                percentage: 40.0
          funding_ids:
            - - 0
              - 0
              - funding_source_id: "REC: ag1_funding_source.id"
                percentage: 100.0

      - step: "Confirm the award as admin"
        action: "call"
        target: "ag1_award"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve the award as admin (opens it, generating the Schedule)"
        action: "call"
        target: "ag1_award"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "The award has a Schedule line on the admission term"
        action: "assert"
        target: "ag1_award"
        asserts:
          schedule_ids:
            type: "o2m"
            check: "count"
            expected_count: 1

      - step: "The admission is still Draft"
        action: "assert"
        target: "ag1_admission"
        asserts:
          state:
            type: "value"
            expected: "draft"

      # -- Negative: deleting a term referred to by a Schedule line
      - step: "Compute Payment is rejected while a Schedule line refers to the term"
        action: "call"
        target: "ag1_admission"
        method: "action_compute_payment"
        as_user: "base.user_admin"
        expect_error:
          type: "UserError"
          message_contains: "is referenced by scholarship award"

      - step: "Deleting a term pinned by a Schedule line is rejected"
        action: "unlink"
        target: "ag1_term1"
        expect_error:
          type: "UserError"
          message_contains: "is referenced by scholarship award"

      # -- Negative: cancelling the admission with an active award
      - step: "Cancel the admission while the award is Open is rejected"
        action: "wizard"
        model: "base.select_cancel_reason"
        target: "ag1_admission"
        as_user: "base.user_admin"
        values:
          cancel_reason_id: "REC: ag1_cancel_reason.id"
        method: "action_confirm"
        expect_error:
          type: "UserError"
          message_contains: "has an active scholarship award"

      # -- Positive: the admission can still be approved to Open
      - step: "Confirm the admission as admin"
        action: "call"
        target: "ag1_admission"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      # Refresh point required before Approve -- test-traps.md T-04.
      - step: "Approve the admission as admin (opens it)"
        action: "call"
        target: "ag1_admission"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "The award still points at the same School Student"
        action: "assert"
        target: "ag1_award"
        asserts:
          student_id:
            type: "m2o"
            expected: "REC: ag1_admission.school_student_id"

      - step: "Cancel the award"
        action: "wizard"
        model: "base.select_cancel_reason"
        target: "ag1_award"
        as_user: "base.user_admin"
        values:
          cancel_reason_id: "REC: ag1_cancel_reason.id"
        method: "action_confirm"
        asserts:
          state:
            type: "value"
            expected: "cancel"

      - step: "Cancel the admission (now Open) once no award is active"
        action: "wizard"
        model: "base.select_cancel_reason"
        target: "ag1_admission"
        as_user: "base.user_admin"
        values:
          cancel_reason_id: "REC: ag1_cancel_reason.id"
        method: "action_confirm"
        asserts:
          state:
            type: "value"
            expected: "cancel"
