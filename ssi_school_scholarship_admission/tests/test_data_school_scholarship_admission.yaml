options:
  auto_refresh: true
scenarios:
  - name:
      "Award Admission - create derives School/Grade, generate schedule from Admission"
    steps:
      # ── Shared fixture chain (suffix SA1) ────────────────────────
      - step: "Create the grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type1"
        values:
          name: "SA1 Grade Type"
          code: "SA1GT"

      - step: "Create the school"
        action: "create"
        model: "school"
        save_as: "school1"
        values:
          name: "SA1 School"
          code: "SA1SC"
          grade_type_id: "REC: grade_type1.id"

      - step: "Create the academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year1"
        values:
          name: "SA1 Academic Year"
          code: "SA1AY"
          date_start: 2026-07-01
          date_end: 2027-06-30

      - step: "Create the academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term1"
        values:
          name: "SA1 Term"
          code: "SA1TM"
          date_start: 2026-07-01
          date_end: 2026-12-31
          year_id: "REC: academic_year1.id"

      - step: "Create the grade"
        action: "create"
        model: "school_grade"
        save_as: "grade1"
        values:
          name: "SA1 Grade"
          code: "SA1GR"
          type_id: "REC: grade_type1.id"

      - step: "Create the admission student's contact"
        action: "create"
        model: "res.partner"
        save_as: "admission_contact1"
        values:
          name: "SA1 Admission Contact"

      - step: "Create the admission"
        action: "create"
        model: "school_admission"
        save_as: "admission1"
        values:
          academic_year_id: "REC: academic_year1.id"
          academic_term_id: "REC: academic_term1.id"
          school_id: "REC: school1.id"
          grade_id: "REC: grade1.id"
          student_id: "REC: admission_contact1.id"
          user_id: "REF: base.user_admin"

      - step: "Confirm the admission as admin"
        action: "call"
        target: "admission1"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      # approve_ok shares its compute method with every other policy
      # field, only re-triggered by @api.depends("policy_template_id")
      # -- an assert alone does not force recompute (test-traps.md T-04,
      # also seen in ssi_school_admission's own official test).
      - step: "Approve the admission as admin (auto-opens)"
        action: "call"
        target: "admission1"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Assert the admission created its School Student on Open"
        action: "assert"
        target: "admission1"
        asserts:
          school_student_id:
            type: "value"
            operator: "is_truthy"

      - step: "Create the analytic account for the funding source"
        action: "create"
        model: "account.analytic.account"
        save_as: "analytic1"
        values:
          name: "SA1 Analytic"

      - step: "Create the funding source"
        action: "create"
        model: "school_scholarship_funding_source"
        save_as: "funding_source1"
        values:
          name: "SA1 Funding Source"
          code: "SA1FS"
          analytic_account_id: "REC: analytic1.id"

      - step: "Create the product covered by the Benefit line"
        action: "create"
        model: "product.product"
        save_as: "product1"
        values:
          name: "SA1 Product"
          type: "service"

      - step: "Create the sale journal used by the scholarship type"
        action: "create"
        model: "account.journal"
        save_as: "journal1"
        values:
          name: "SA1 Journal"
          code: "JSA1"
          type: "sale"

      - step: "Get the account.account.type Income reference"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "account_type_income"

      - step: "Create the discount account"
        action: "create"
        model: "account.account"
        save_as: "discount_account1"
        values:
          name: "SA1 Discount Account"
          code: "SA1DA"
          user_type_id: "REC: account_type_income.id"
          reconcile: false

      - step: "Create the income account used by the payment term detail"
        action: "create"
        model: "account.account"
        save_as: "income_account1"
        values:
          name: "SA1 Income Account"
          code: "SA1IA"
          user_type_id: "REC: account_type_income.id"
          reconcile: false

      - step: "Create the scholarship type"
        action: "create"
        model: "school_scholarship_type"
        save_as: "type1"
        values:
          name: "SA1 Type"
          code: "SA1TY"
          deduction_journal_id: "REC: journal1.id"
          discount_account_id: "REC: discount_account1.id"

      - step: "Create the scholarship program"
        action: "create"
        model: "school_scholarship_program"
        save_as: "program1"
        values:
          name: "SA1 Program"
          code: "SA1PRG"
          type_id: "REC: type1.id"
          school_id: "REC: school1.id"
          academic_year_id: "REC: academic_year1.id"
          funding_source_ids: [[6, 0, ["REC: funding_source1.id"]]]
          deduction_journal_id: "REC: journal1.id"
          discount_account_id: "REC: discount_account1.id"
          scope_ids:
            - - 0
              - 0
              - scope_basis: "product"
                product_id: "REC: product1.id"
                benefit_type: "fee_reduction"
                computation: "percentage"
                percentage: 40.0

      - step: "Create an Admission Payment Term matching the Benefit's Product"
        action: "create"
        model: "school_admission_payment_term"
        save_as: "payment_term1"
        values:
          admission_id: "REC: admission1.id"
          name: "SA1 Payment Term"
          date_invoice: 2026-08-01
          detail_ids:
            - - 0
              - 0
              - product_id: "REC: product1.id"
                name: "SA1 Payment Term Fee"
                account_id: "REC: income_account1.id"
                uom_quantity: 1.0
                uom_id: "REF: uom.product_uom_unit"
                price_unit: 1000000.0

      - step: "Create the Admission-sourced award"
        action: "create"
        model: "school_scholarship_award"
        save_as: "award1"
        values:
          program_id: "REC: program1.id"
          source_type: "admission"
          admission_id: "REC: admission1.id"
          student_id: "REC: admission1.school_student_id.id"
          date_start: 2026-07-01
          date_end: 2026-12-31
          discount_account_id: "REC: discount_account1.id"
          user_id: "REF: base.user_admin"
          benefit_ids:
            - - 0
              - 0
              - name: "SA1 Benefit Line"
                product_id: "REC: product1.id"
                percentage: 40.0
          funding_ids:
            - - 0
              - 0
              - funding_source_id: "REC: funding_source1.id"
                percentage: 100.0

      - step: "Assert School/Grade were derived from the Admission"
        action: "assert"
        target: "award1"
        asserts:
          school_id:
            type: "m2o"
            expected: "REC: school1"
          grade_id:
            type: "m2o"
            expected: "REC: grade1"

      - step: "Confirm the award as admin"
        action: "call"
        target: "award1"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve the award as admin (auto-opens, generates schedule)"
        action: "call"
        target: "award1"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Assert opening generated exactly one Schedule line"
        action: "search"
        model: "school_scholarship_award_schedule"
        domain: [["award_id", "=", "REC: award1.id"]]
        save_as: "award1_schedule"
        expect_count: 1

      - step: "Assert the Schedule line was realized from the Admission Payment Term"
        action: "assert"
        target: "award1_schedule"
        asserts:
          admission_payment_term_id:
            type: "m2o"
            expected: "REC: payment_term1"
          payment_term_id:
            type: "value"
            operator: "is_falsy"
          base_amount:
            type: "value"
            expected: 1000000.0
          amount_planned:
            type: "value"
            expected: 400000.0

