          reconcile: false

      - step: "Create the income account used by the payment term detail"
        action: "create"
        model: "account.account"
        save_as: "income_account4"
        values:
          name: "SA4 Income Account"
          code: "SA4IA"
          user_type_id: "REC: account_type_income.id"
          reconcile: false

      - step: "Create the scholarship type"
        action: "create"
        model: "school_scholarship_type"
        save_as: "type4"
        values:
          name: "SA4 Type"
          code: "SA4TY"
          deduction_journal_id: "REC: journal4.id"
          discount_account_id: "REC: discount_account4.id"

      - step: "Create the scholarship program"
        action: "create"
        model: "school_scholarship_program"
        save_as: "program4"
        values:
          name: "SA4 Program"
          code: "SA4PRG"
          type_id: "REC: type4.id"
          school_id: "REC: school4.id"
          academic_year_id: "REC: academic_year4.id"
          funding_source_ids: [[6, 0, ["REC: funding_source4.id"]]]
          deduction_journal_id: "REC: journal4.id"
          discount_account_id: "REC: discount_account4.id"
          scope_ids:
            - - 0
              - 0
              - scope_basis: "product"
                product_id: "REC: product4.id"
                benefit_type: "fee_reduction"
                computation: "percentage"
                percentage: 40.0

      - step: "Create an Enrollment Payment Term matching the Benefit's Product"
        action: "create"
        model: "school_enrollment_payment_term"
        save_as: "payment_term4"
        values:
          enrollment_id: "REC: enrollment4.id"
          name: "SA4 Payment Term"
          date_invoice: 2026-08-01
          detail_ids:
            - - 0
              - 0
              - product_id: "REC: product4.id"
                name: "SA4 Payment Term Fee"
                account_id: "REC: income_account4.id"
                uom_quantity: 1.0
                uom_id: "REF: uom.product_uom_unit"
                price_unit: 1000000.0

      - step: "Create the Enrollment-sourced award (Billing Source default)"
        action: "create"
        model: "school_scholarship_award"
        save_as: "award4"
        values:
          program_id: "REC: program4.id"
          student_id: "REC: student4.id"
          enrollment_id: "REC: enrollment4.id"
          date_start: 2026-07-01
          date_end: 2026-12-31
          discount_account_id: "REC: discount_account4.id"
          user_id: "REF: base.user_admin"
          benefit_ids:
            - - 0
              - 0
              - name: "SA4 Benefit Line"
                product_id: "REC: product4.id"
                percentage: 40.0
          funding_ids:
            - - 0
              - 0
              - funding_source_id: "REC: funding_source4.id"
                percentage: 100.0

      - step: "Assert Billing Source stayed at the default Enrollment"
        action: "assert"
        target: "award4"
        asserts:
          source_type:
            type: "value"
            expected: "enrollment"

      - step: "Confirm the award as admin"
        action: "call"
        target: "award4"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Approve the award as admin (auto-opens, generates schedule)"
        action: "call"
        target: "award4"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Assert opening generated exactly one Schedule line"
        action: "search"
        model: "school_scholarship_award_schedule"
        domain: [["award_id", "=", "REC: award4.id"]]
        save_as: "award4_schedule"
        expect_count: 1

      - step: "Assert the Schedule line was realized from the Enrollment Payment Term"
        action: "assert"
        target: "award4_schedule"
        asserts:
          payment_term_id:
            type: "m2o"
            expected: "REC: payment_term4"
          admission_payment_term_id:
            type: "value"
            operator: "is_falsy"
          amount_planned:
            type: "value"
            expected: 400000.0

  - name: "Award Admission - Negative Paths"
    steps:
      # ── Shared fixture chain (suffix SA5) ────────────────────────
      - step: "Create the grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type5"
        values:
          name: "SA5 Grade Type"
          code: "SA5GT"

      - step: "Create the school"
        action: "create"
        model: "school"
        save_as: "school5"
        values:
          name: "SA5 School"
          code: "SA5SC"
          grade_type_id: "REC: grade_type5.id"

      - step: "Create the academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year5"
        values:
          name: "SA5 Academic Year"
          code: "SA5AY"
          date_start: 2026-07-01
          date_end: 2027-06-30

      - step: "Create the academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term5"
        values:
          name: "SA5 Term"
          code: "SA5TM"
          date_start: 2026-07-01
          date_end: 2026-12-31
          year_id: "REC: academic_year5.id"

      - step: "Create the grade"
        action: "create"
        model: "school_grade"
        save_as: "grade5"
        values:
          name: "SA5 Grade"
          code: "SA5GR"
          type_id: "REC: grade_type5.id"

      - step: "Create the analytic account for the funding source"
        action: "create"
        model: "account.analytic.account"
        save_as: "analytic5"
        values:
          name: "SA5 Analytic"

      - step: "Create the funding source"
        action: "create"
        model: "school_scholarship_funding_source"
        save_as: "funding_source5"
        values:
          name: "SA5 Funding Source"
          code: "SA5FS"
          analytic_account_id: "REC: analytic5.id"

      - step: "Create the product covered by the scope line"
        action: "create"
        model: "product.product"
        save_as: "product5"
        values:
          name: "SA5 Product"
          type: "service"

      - step: "Create the sale journal used by the scholarship type"
        action: "create"
        model: "account.journal"
        save_as: "journal5"
        values:
          name: "SA5 Journal"
          code: "JSA5"
          type: "sale"

      - step: "Get the account.account.type Income reference"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "account_type_income"

      - step: "Create the discount account"
        action: "create"
        model: "account.account"
        save_as: "discount_account5"
        values:
          name: "SA5 Discount Account"
          code: "SA5DA"
          user_type_id: "REC: account_type_income.id"
          reconcile: false

      - step: "Create the scholarship type"
        action: "create"
        model: "school_scholarship_type"
        save_as: "type5"
        values:
          name: "SA5 Type"
          code: "SA5TY"
          deduction_journal_id: "REC: journal5.id"
          discount_account_id: "REC: discount_account5.id"

      - step: "Create the scholarship program"
        action: "create"
        model: "school_scholarship_program"
        save_as: "program5"
        values:
          name: "SA5 Program"
          code: "SA5PRG"
          type_id: "REC: type5.id"
          school_id: "REC: school5.id"
          academic_year_id: "REC: academic_year5.id"
          funding_source_ids: [[6, 0, ["REC: funding_source5.id"]]]
          deduction_journal_id: "REC: journal5.id"
          discount_account_id: "REC: discount_account5.id"
          scope_ids:
            - - 0
              - 0
              - scope_basis: "product"
                product_id: "REC: product5.id"
                benefit_type: "fee_reduction"
                computation: "percentage"
                percentage: 40.0

      # ── Negative: Billing Source Admission with no Admission ─────
      - step: "Create a school_student to give the negative-path award a Student"
        action: "create"
        model: "res.partner"
        save_as: "bare_contact5"
        values:
          name: "SA5 Bare Contact"

      - step: "Create the school_student"
        action: "create"
        model: "school_student"
        save_as: "bare_student5"
        values:
          name: "SA5 Bare Student"
          code: "SA5BST"
          contact_id: "REC: bare_contact5.id"
          school_id: "REC: school5.id"

      - step: "Reject an Admission-sourced award with no Admission"
        action: "create"
        model: "school_scholarship_award"
        expect_error:
          type: "ValidationError"
          message_contains: "billing source"
        values:
          program_id: "REC: program5.id"
          student_id: "REC: bare_student5.id"
          source_type: "admission"
          date_start: 2026-07-01
          date_end: 2026-12-31
          discount_account_id: "REC: discount_account5.id"

      # ── Negative: Admission has not reached Open (still Draft) ───
      - step: "Create the admission student's contact"
        action: "create"
        model: "res.partner"
        save_as: "admission_contact5a"
        values:
          name: "SA5 Admission Contact A"

      - step: "Create an admission left in Draft"
        action: "create"
        model: "school_admission"
        save_as: "admission5a"
        values:
          academic_year_id: "REC: academic_year5.id"
          academic_term_id: "REC: academic_term5.id"
          school_id: "REC: school5.id"
          grade_id: "REC: grade5.id"
          student_id: "REC: admission_contact5a.id"

      - step: "Reject an award billed against a still-Draft Admission"
        action: "create"
        model: "school_scholarship_award"
        expect_error:
          type: "ValidationError"
          message_contains: "has not reached Open"
        values:
          program_id: "REC: program5.id"
          student_id: "REC: bare_student5.id"
          source_type: "admission"
          admission_id: "REC: admission5a.id"
          date_start: 2026-07-01
          date_end: 2026-12-31
          discount_account_id: "REC: discount_account5.id"

      # ── Negative: Admission's School Student differs from Student ─
      - step: "Create a second admission's contact"
        action: "create"
        model: "res.partner"
        save_as: "admission_contact5b"
        values:
          name: "SA5 Admission Contact B"

      - step: "Create a second admission, opened"
        action: "create"
        model: "school_admission"
        save_as: "admission5b"
        values:
          academic_year_id: "REC: academic_year5.id"
          academic_term_id: "REC: academic_term5.id"
          school_id: "REC: school5.id"
          grade_id: "REC: grade5.id"
          student_id: "REC: admission_contact5b.id"
          user_id: "REF: base.user_admin"

      - step: "Confirm the second admission as admin"
        action: "call"
        target: "admission5b"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Approve the second admission as admin (auto-opens)"
        action: "call"
        target: "admission5b"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Reject an award mixing an unrelated Student with Admission B"
        action: "create"
        model: "school_scholarship_award"
        expect_error:
          type: "ValidationError"
          message_contains: "does not belong"
        values:
          program_id: "REC: program5.id"
          student_id: "REC: bare_student5.id"
          source_type: "admission"
          admission_id: "REC: admission5b.id"
          date_start: 2026-07-01
          date_end: 2026-12-31
          discount_account_id: "REC: discount_account5.id"

      # ── Negative: Admission currency differs from company currency ─
      - step: "Find a currency different from the company currency"
        action: "search"
        model: "res.currency"
        # ``active_test: false`` -- most non-company currencies are
        # inactive by default, and the default search would otherwise
        # filter them all out, leaving no candidate to pick.
        context:
          active_test: false
        domain: [["id", "!=", "REC: company.currency_id.id"]]
        limit: 1
        save_as: "other_currency5"

      - step: "Create a third admission's contact"
        action: "create"
        model: "res.partner"
        save_as: "admission_contact5c"
        values:
          name: "SA5 Admission Contact C"

      - step: "Create a third admission, billed in the other currency, opened"
        action: "create"
        model: "school_admission"
        save_as: "admission5c"
        values:
          academic_year_id: "REC: academic_year5.id"
          academic_term_id: "REC: academic_term5.id"
          school_id: "REC: school5.id"
          grade_id: "REC: grade5.id"
          student_id: "REC: admission_contact5c.id"
          currency_id: "REC: other_currency5.id"
          user_id: "REF: base.user_admin"

      - step: "Confirm the third admission as admin"
        action: "call"
        target: "admission5c"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Approve the third admission as admin (auto-opens)"
        action: "call"
        target: "admission5c"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Reject an award whose currency does not match the Admission"
        action: "create"
        model: "school_scholarship_award"
        expect_error:
          type: "ValidationError"
          message_contains: "currency"
        values:
          program_id: "REC: program5.id"
          student_id: "REC: admission5c.school_student_id.id"
          source_type: "admission"
          admission_id: "REC: admission5c.id"
          date_start: 2026-07-01
          date_end: 2026-12-31
          discount_account_id: "REC: discount_account5.id"
